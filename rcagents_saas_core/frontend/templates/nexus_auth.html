<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus POS — تسجيل متجر جديد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e); min-height: 100vh; }
        .glow-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-input { background: rgba(255,255,255,0.08); border: 1px solid rgba(168,85,247,0.3); transition: all 0.3s; }
        .neon-input:focus { border-color: #A855F7; box-shadow: 0 0 20px rgba(168,85,247,0.3); outline: none; }
        .btn-neon { background: linear-gradient(135deg, #7C3AED, #A855F7); transition: all 0.3s; }
        .btn-neon:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(168,85,247,0.5); }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md glow-card rounded-2xl p-8">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-5xl mb-2">💎</div>
            <h1 class="text-3xl font-bold text-white">Nexus POS</h1>
            <p class="text-gray-400 text-sm mt-1">منصة نقاط البيع السحابية للتجار</p>
        </div>

        <!-- Tabs -->
        <div class="flex mb-6 bg-gray-800/50 rounded-xl p-1">
            <button onclick="showTab('register')" id="tab-register" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-purple-600 text-white">تسجيل متجر جديد</button>
            <button onclick="showTab('login')" id="tab-login" class="flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-400 hover:text-white">تسجيل الدخول</button>
        </div>

        <!-- Register Form -->
        <div id="form-register">
            <form id="register-form" onsubmit="registerStore(event)">
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-2">اسم المتجر <span class="text-red-400">*</span></label>
                    <input type="text" id="store-name" required
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="مثال: أزياء الجزائر">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-2">اسم المستخدم <span class="text-red-400">*</span></label>
                    <input type="text" id="reg-username" required
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="اسم الدخول للنظام">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-2">كلمة المرور <span class="text-red-400">*</span></label>
                    <input type="password" id="reg-password" required minlength="6"
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="6 أحرف على الأقل">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-2">البريد الإلكتروني</label>
                    <input type="email" id="reg-email"
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="example@store.com">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm mb-2">رقم الهاتف</label>
                    <input type="tel" id="reg-phone"
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="+213 6XX XX XX XX">
                </div>
                <button type="submit" class="btn-neon w-full rounded-xl py-3 text-white font-bold text-lg">
                    🚀 إنشاء المتجر
                </button>
            </form>
            <div id="register-status" class="mt-4 text-center text-sm hidden"></div>
        </div>

        <!-- Login Form -->
        <div id="form-login" class="hidden">
            <form id="login-form" onsubmit="loginStore(event)">
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm mb-2">اسم المستخدم <span class="text-red-400">*</span></label>
                    <input type="text" id="login-username" required
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="اسم المستخدم">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm mb-2">كلمة المرور <span class="text-red-400">*</span></label>
                    <input type="password" id="login-password" required
                        class="neon-input w-full rounded-xl px-4 py-3 text-white text-sm"
                        placeholder="كلمة المرور">
                </div>
                <button type="submit" class="btn-neon w-full rounded-xl py-3 text-white font-bold text-lg">
                    🔑 دخول
                </button>
            </form>
            <div id="login-status" class="mt-4 text-center text-sm hidden"></div>
        </div>

        <div class="mt-6 text-center">
            <p class="text-gray-500 text-xs">Royal Chaussures &bull; Nexus POS Platform</p>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('tab-register').className = tab === 'register' 
                ? 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-purple-600 text-white'
                : 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-400 hover:text-white';
            document.getElementById('tab-login').className = tab === 'login'
                ? 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all bg-purple-600 text-white'
                : 'flex-1 py-2.5 rounded-lg text-sm font-bold transition-all text-gray-400 hover:text-white';
        }

        async function registerStore(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const status = document.getElementById('register-status');
            status.classList.remove('hidden');
            status.className = 'mt-4 text-center text-sm';
            btn.disabled = true;
            btn.innerHTML = '⏳ جاري الإنشاء...';

            try {
                const res = await fetch('/api/v1/store/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        store_name: document.getElementById('store-name').value,
                        username: document.getElementById('reg-username').value,
                        password: document.getElementById('reg-password').value,
                        email: document.getElementById('reg-email').value,
                        phone: document.getElementById('reg-phone').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    status.className = 'mt-4 text-center text-sm text-green-400';
                    status.innerHTML = '✅ ' + data.message + '<br><br>📱 انتقل إلى صفحة الدخول';
                    e.target.reset();
                    setTimeout(() => showTab('login'), 2000);
                } else {
                    status.className = 'mt-4 text-center text-sm text-red-400';
                    status.innerHTML = '❌ ' + (data.error || 'حدث خطأ');
                }
            } catch(err) {
                status.className = 'mt-4 text-center text-sm text-red-400';
                status.innerHTML = '❌ خطأ في الاتصال بالخادم';
            }
            btn.disabled = false;
            btn.innerHTML = '🚀 إنشاء المتجر';
        }

        async function loginStore(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const status = document.getElementById('login-status');
            status.classList.remove('hidden');
            status.className = 'mt-4 text-center text-sm';
            btn.disabled = true;
            btn.innerHTML = '⏳ جاري الدخول...';

            try {
                const res = await fetch('/api/v1/store/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    // Save token and redirect to POS
                    localStorage.setItem('nexus_token', data.token);
                    localStorage.setItem('nexus_user', JSON.stringify(data.user));
                    status.className = 'mt-4 text-center text-sm text-green-400';
                    status.innerHTML = '✅ تم الدخول بنجاح! جاري تحويلك إلى لوحة التحكم...';
                    setTimeout(() => { window.location.href = '/api/v1/store/pos'; }, 1000);
                } else {
                    status.className = 'mt-4 text-center text-sm text-red-400';
                    status.innerHTML = '❌ ' + (data.error || 'خطأ في الدخول');
                }
            } catch(err) {
                status.className = 'mt-4 text-center text-sm text-red-400';
                status.innerHTML = '❌ خطأ في الاتصال بالخادم';
            }
            btn.disabled = false;
            btn.innerHTML = '🔑 دخول';
        }
    </script>
</body>
</html>
