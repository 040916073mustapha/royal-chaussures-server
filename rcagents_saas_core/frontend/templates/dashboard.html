{% extends "dashboard_base.html" %}
{% block content %}
<div x-data="{
    view: 'overview',
    loading: true,
    storeId: '1',

    // API data buckets
    stats: {},
    ordersList: [],
    products: [],
    clients: [],
    salesByChannel: {},
    aiBrain: {},
    conversations: [],
    convMessages: [],

    // UI state
    selectedConvId: null,
    searchQuery: '',
    orderSearch: '',
    orderStatusFilter: '',

    async init() {
        const params = new URLSearchParams(window.location.search);
        const v = params.get('view');
        if (v) this.view = v;

        const sid = this.storeId;

        try {
            const [statsRes, ordersRes, productsRes, clientsRes, salesRes, brainRes] = await Promise.all([
                fetch(`/api/stats?store_id=${sid}`).then(r => r.json()).catch(() => ({})),
                fetch(`/api/orders?store_id=${sid}&limit=20`).then(r => r.json()).catch(() => ({orders: []})),
                fetch(`/api/products?store_id=${sid}`).then(r => r.json()).catch(() => ({products: [], total: 0})),
                fetch(`/api/clients?store_id=${sid}`).then(r => r.json()).catch(() => ({clients: [], total: 0})),
                fetch(`/api/stats/sales-by-channel?store_id=${sid}`).then(r => r.json()).catch(() => ({channels: []})),
                fetch(`/api/stats/ai-brain?store_id=${sid}`).then(r => r.json()).catch(() => ({configured: false}))
            ]);

            this.stats = statsRes;
            this.ordersList = ordersRes.orders || [];
            this.products = productsRes.products || [];
            this.clients = clientsRes.clients || [];
            this.salesByChannel = salesRes;
            this.aiBrain = brainRes;
        } catch (e) {
            console.error('Dashboard init error:', e);
        }

        this.loading = false;
    },

    async loadConversations() {
        try {
            const res = await fetch(`/api/conversations/${this.storeId}?limit=50`);
            const data = await res.json();
            this.conversations = data.conversations || [];
        } catch (e) {
            console.error('Load conversations error:', e);
            this.conversations = [];
        }
    },

    async loadConversationMessages(convId) {
        this.selectedConvId = convId;
        try {
            const res = await fetch(`/api/conversations/${this.storeId}/${convId}/messages`);
            const data = await res.json();
            this.convMessages = data.messages || [];
        } catch (e) {
            console.error('Load messages error:', e);
            this.convMessages = [];
        }
    },

    filteredOrders() {
        let items = this.ordersList;
        if (this.orderStatusFilter) {
            items = items.filter(o => o.status === this.orderStatusFilter);
        }
        if (this.orderSearch) {
            const q = this.orderSearch.toLowerCase();
            items = items.filter(o =>
                (o.customer||'').toLowerCase().includes(q) ||
                (o.phone||'').toLowerCase().includes(q) ||
                (o.product||'').toLowerCase().includes(q)
            );
        }
        return items;
    },
    get channelColors() {
        return {
            messenger: { bg: 'from-blue-500/10 to-blue-600/5', text: 'text-blue-400', border: 'border-blue-500/20', icon: 'fab fa-facebook-messenger' },
            instagram: { bg: 'from-pink-500/10 to-purple-600/5', text: 'text-pink-400', border: 'border-pink-500/20', icon: 'fab fa-instagram' },
            whatsapp: { bg: 'from-emerald-500/10 to-green-600/5', text: 'text-emerald-400', border: 'border-emerald-500/20', icon: 'fab fa-whatsapp' }
        };
    },

    channelStyle(ch) {
        return this.channelColors[ch] || { bg: 'from-gray-500/10 to-gray-600/5', text: 'text-gray-400', border: 'border-gray-500/20', icon: 'fa-solid fa-comment' };
    },

    formatDate(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('fr-DZ', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    },

    statusBadge(status) {
        const s = (status || '').toLowerCase();
        if (s === 'paid' || s === 'confirme' || s === 'livre' || s === 'delivered') return 'bg-emerald-400/10 text-emerald-400 border-emerald-400/30';
        if (s === 'pending' || s === 'nouveau') return 'bg-yellow-400/10 text-yellow-400 border-yellow-400/30';
        if (s === 'annule' || s === 'cancelled' || s === 'failed') return 'bg-rose-400/10 text-rose-400 border-rose-400/30';
        if (s === 'processing' || s === 'shipped') return 'bg-sky-400/10 text-sky-400 border-sky-400/30';
        return 'bg-gray-500/10 text-gray-400 border-gray-500/30';
    },

    truncate(str, len = 60) {
        if (!str) return '—';
        return str.length > len ? str.slice(0, len) + '...' : str;
    }
}"

x-init="init()">

    <!-- Welcome + Date Range -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-3">
        <div>
            <h1 class="text-xl font-bold text-white tracking-tight">Welcome Back, Mustapha <span class="inline-block animate-pulse">👋</span></h1>
            <p class="text-xs text-gray-500 mt-1 font-mono">
                <template x-if="stats.store_name">
                    <span x-text="stats.store_name + ' — '"></span>
                </template>
                <span>Real‑time dashboard synced with live APIs</span>
            </p>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-rc-card border border-rc-border/60 rounded-lg px-3 py-1.5 text-[10px] font-mono text-gray-400 flex items-center gap-2">
                <i class="fa-regular fa-calendar text-neon-purple"></i>
                <span>Live Data</span>
            </div>
            <div class="bg-rc-card border border-rc-border/60 rounded-lg px-2.5 py-1.5 text-[10px] text-gray-500 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-mono">LIVE</span>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="py-20 text-center">
        <div class="inline-flex items-center gap-3 text-gray-500">
            <i class="fa-solid fa-circle-notch text-neon-purple text-xl animate-spin"></i>
            <span class="text-sm font-mono tracking-wider">LOADING DASHBOARD DATA</span>
        </div>
    </div>

    <template x-if="!loading">
        <div>

            <!-- ═══════════════════ OVERVIEW ═══════════════════ -->
            <div x-show="view === 'overview'">
                <!-- KPI CARDS -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <!-- Conversations -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-neon-purple/5 to-transparent rounded-bl-full"></div>
                        <div class="relative">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Conversations</span>
                                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-purple/10 to-neon-cyan/10 border border-neon-purple/20 flex items-center justify-center text-neon-purple"><i class="fa-solid fa-comments text-sm"></i></div>
                            </div>
                            <p class="text-2xl font-bold text-white font-mono tracking-tight" x-text="(stats.total_conversations || 0).toLocaleString()"></p>
                            <div class="mt-2 flex items-center gap-1.5">
                                <span class="text-[10px] font-mono text-neon-cyan bg-neon-cyan/10 px-1.5 py-0.5 rounded flex items-center gap-0.5"><i class="fa-solid fa-circle text-[6px]"></i> <span x-text="(stats.active_conversations || 0) + ' active'"></span></span>
                            </div>
                        </div>
                    </div>
                    <!-- Messages -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow group">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Messages</span>
                            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-cyan/10 to-neon-purple/10 border border-neon-cyan/20 flex items-center justify-center text-neon-cyan"><i class="fa-solid fa-message text-sm"></i></div>
                        </div>
                        <p class="text-2xl font-bold text-white font-mono tracking-tight" x-text="(stats.total_messages || 0).toLocaleString()"></p>
                        <div class="mt-2 flex items-center gap-1.5">
                            <span class="text-[10px] font-mono text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded flex items-center gap-0.5"><i class="fa-solid fa-arrow-up text-[9px]"></i> <span x-text="(stats.messages_today || 0) + ' today'"></span></span>
                        </div>
                    </div>
                    <!-- AI Brain -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow group">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">AI Brain</span>
                            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-pink/10 to-neon-purple/10 border border-neon-pink/20 flex items-center justify-center text-neon-pink"><i class="fa-solid fa-brain text-sm"></i></div>
                        </div>
                        <p class="text-2xl font-bold text-white font-mono tracking-tight" x-text="aiBrain.configured ? 'Online' : 'Offline'"></p>
                        <div class="mt-2 flex items-center gap-1.5">
                            <span class="text-[10px] font-mono text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded flex items-center gap-0.5" x-show="aiBrain.configured"><span x-text="aiBrain.model ? aiBrain.model.split('/').pop() : '—'"></span></span>
                            <span class="text-[10px] font-mono text-yellow-400 bg-yellow-400/10 px-1.5 py-0.5 rounded" x-show="!aiBrain.configured">Not configured</span>
                        </div>
                    </div>
                    <!-- Revenue -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow group">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Revenue (USD)</span>
                            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-400/10 to-neon-purple/10 border border-amber-400/20 flex items-center justify-center text-amber-400"><i class="fa-solid fa-coins text-sm"></i></div>
                        </div>
                        <p class="text-2xl font-bold text-white font-mono tracking-tight" x-text="'$' + (stats.total_revenue_usd || 0).toLocaleString(undefined, {minimumFractionDigits:2})"></p>
                        <div class="mt-2 flex items-center gap-1.5">
                            <span class="text-[10px] font-mono text-gray-400 bg-gray-500/10 px-1.5 py-0.5 rounded"><span x-text="(stats.total_invoices || 0) + ' invoices'"></span></span>
                        </div>
                    </div>
                </div>

                <!-- CHARTS ROW -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8">
                    <!-- Sales by Channel Donut -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-rc-border/40">
                            <div><h3 class="text-sm font-semibold text-white">Sales by Channel</h3></div>
                        </div>
                        <div class="flex items-center justify-center h-40">
                            <canvas x-init="setTimeout(() => {
                                const chs = salesByChannel.channels || [];
                                if (chs.length === 0) return;
                                new Chart($el.getContext('2d'), {
                                    type: 'doughnut',
                                    data: {
                                        labels: chs.map(c => c.label || c.channel),
                                        datasets: [{
                                            data: chs.map(c => c.percentage || 0),
                                            backgroundColor: ['#A855F7','#EC4899','#06B6D4','#22C55E','#FBBF24'],
                                            borderColor: '#0A0A0F',
                                            borderWidth: 3
                                        }]
                                    },
                                    options: {
                                        responsive: true, maintainAspectRatio: false, cutout: '62%',
                                        plugins: { legend: { position: 'bottom', labels: { color: '#94A3B8', font: { size: 9, family: 'JetBrains Mono' }, padding: 10, usePointStyle: true, pointStyle: 'circle' } } }
                                    }
                                });
                            }, 200)"></canvas>
                        </div>
                        <template x-if="(salesByChannel.channels || []).length > 0">
                            <div class="mt-3 grid grid-cols-2 gap-2 text-center">
                                <template x-for="ch in (salesByChannel.channels || [])" :key="ch.channel">
                                    <div class="bg-rc-card-hover/50 rounded-lg p-2">
                                        <p class="text-[10px] font-mono text-gray-500" x-text="ch.label"></p>
                                        <p class="text-sm font-bold text-neon-purple font-mono" x-text="ch.percentage + '%'"></p>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template x-if="(salesByChannel.channels || []).length === 0">
                            <div class="text-center py-6 text-gray-500 text-xs font-mono">No channel data</div>
                        </template>
                    </div>
                    <!-- Recent Orders -->
                    <div class="lg:col-span-2 bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow">
                        <div class="flex items-center justify-between mb-4 pb-3 border-b border-rc-border/40">
                            <div class="flex items-center gap-2"><i class="fa-solid fa-receipt text-neon-purple text-xs"></i><h3 class="text-sm font-semibold text-white">Recent Orders</h3></div>
                            <a href="/dashboard?view=orders" class="text-[10px] font-mono text-neon-purple hover:text-neon-cyan">View all <i class="fa-solid fa-arrow-right text-[9px]"></i></a>
                        </div>
                        <template x-if="ordersList.length === 0">
                            <div class="text-center py-8 text-gray-500"><i class="fa-solid fa-inbox text-2xl mb-2 opacity-30"></i><p class="text-xs font-mono">No orders yet</p></div>
                        </template>
                        <div x-show="ordersList.length > 0" class="overflow-x-auto">
                            <table class="w-full text-xs">
                                <thead><tr class="text-gray-500 font-mono text-[10px] border-b border-rc-border/40">
                                    <th class="text-left py-2.5 pr-2 font-medium">Order</th><th class="text-left py-2.5 pr-2 font-medium">Customer</th><th class="text-right py-2.5 pr-2 font-medium">Amount</th><th class="text-right py-2.5 pr-2 font-medium">Status</th><th class="text-right py-2.5 pr-2 font-medium">Date</th>
                                </tr></thead>
                                <tbody>
                                    <template x-for="o in ordersList.slice(0,6)" :key="o.id">
                                        <tr class="border-b border-rc-border/20 hover:bg-rc-card-hover/30 transition-colors">
                                            <td class="py-3 pr-2"><span class="text-[11px] font-mono text-gray-400" x-text="'#' + (o.order_number || o.id)"></span></td>
                                            <td class="py-3 pr-2"><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-lg bg-gradient-to-br from-rc-card-hover to-rc-card border border-rc-border/40 flex items-center justify-center text-[9px] text-gray-500 font-bold" x-text="(o.customer||'?')[0]"></div><p class="text-xs font-medium text-gray-200" x-text="o.customer || 'Guest'"></p></div></td>
                                            <td class="py-3 pr-2 text-right"><span class="text-xs font-mono font-bold text-white" x-text="'$' + (o.total||0).toFixed(2)"></span></td>
                                            <td class="py-3 pr-2 text-right"><span class="text-[10px] font-mono font-semibold px-2 py-1 rounded border capitalize" :class="statusBadge(o.status)" x-text="o.status"></span></td>
                                            <td class="py-3 pr-2 text-right"><span class="text-[10px] font-mono text-gray-500" x-text="formatDate(o.created_at)"></span></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- BOTTOM ROW -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                    <!-- AI Brain Status -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-rc-border/40"><i class="fa-solid fa-microchip text-neon-cyan text-xs"></i><h3 class="text-sm font-semibold text-white">AI Brain Status</h3></div>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between"><span class="text-xs text-gray-300">Configured</span><span class="text-[10px] font-mono" :class="aiBrain.configured ? 'text-emerald-400' : 'text-rose-400'" x-text="aiBrain.configured ? 'Yes' : 'No'"></span></div>
                            <div class="flex items-center justify-between" x-show="aiBrain.configured"><span class="text-xs text-gray-300">Model</span><span class="text-[10px] font-mono text-neon-cyan" x-text="aiBrain.model || '—'"></span></div>
                            <div class="flex items-center justify-between" x-show="aiBrain.configured"><span class="text-xs text-gray-300">Language</span><span class="text-[10px] font-mono text-gray-400 uppercase" x-text="aiBrain.language || 'ar'"></span></div>
                            <div class="flex items-center justify-between" x-show="aiBrain.configured"><span class="text-xs text-gray-300">Messages Handled</span><span class="text-[10px] font-mono text-neon-purple" x-text="(aiBrain.messages_handled || 0).toLocaleString()"></span></div>
                            <div class="flex items-center justify-between" x-show="aiBrain.configured"><span class="text-xs text-gray-300">Resolution Rate</span><span class="text-[10px] font-mono text-emerald-400" x-text="(aiBrain.resolution_rate || 0) + '%'"></span></div>
                            <div class="flex items-center justify-between" x-show="aiBrain.configured"><span class="text-xs text-gray-300">Active Conversations</span><span class="text-[10px] font-mono text-gray-400" x-text="aiBrain.active_conversations || 0"></span></div>
                            <div class="flex items-center justify-between" x-show="aiBrain.configured"><span class="text-xs text-gray-300">Products in Catalog</span><span class="text-[10px] font-mono text-amber-400" x-text="aiBrain.product_count || 0"></span></div>
                        </div>
                    </div>
                    <!-- Active Channels -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-rc-border/40"><i class="fa-solid fa-plug text-emerald-400 text-xs"></i><h3 class="text-sm font-semibold text-white">Active Channels</h3></div>
                        <div class="space-y-3">
                            <template x-for="ch in (stats.active_channels || [])" :key="ch.type">
                                <div class="flex items-center gap-3 p-2.5 rounded-lg hover:bg-rc-card-hover/30 transition-colors">
                                    <div class="w-8 h-8 rounded-lg border flex items-center justify-center text-sm shrink-0" :class="channelStyle(ch.type).bg + ' ' + channelStyle(ch.type).text + ' ' + channelStyle(ch.type).border">
                                        <i :class="channelStyle(ch.type).icon"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-medium text-gray-200" x-text="ch.name || ch.type"></span>
                                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                        </div>
                                        <p class="text-[10px] font-mono text-gray-500 mt-0.5"><span x-text="(stats.channel_counts || {})[ch.type] || 0"></span> conversations</p>
                                    </div>
                                </div>
                            </template>
                            <template x-if="(!stats.active_channels || stats.active_channels.length === 0)">
                                <div class="text-center py-4 text-gray-500 text-xs font-mono">No active channels</div>
                            </template>
                        </div>
                    </div>
                    <!-- Quick Actions -->
                    <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-rc-border/40"><i class="fa-solid fa-bolt text-neon-purple text-xs"></i><h3 class="text-sm font-semibold text-white">Quick Actions</h3></div>
                        <div class="grid grid-cols-2 gap-3">
                            <a href="/dashboard?view=products" class="bg-rc-card-hover/50 border border-rc-border/40 rounded-xl p-4 text-center hover:border-neon-purple/30 transition-all duration-300 group">
                                <div class="w-10 h-10 rounded-xl bg-neon-purple/10 border border-neon-purple/20 flex items-center justify-center text-neon-purple mx-auto mb-2"><i class="fa-solid fa-plus text-sm"></i></div>
                                <p class="text-xs font-medium text-gray-300">Add Product</p>
                            </a>
                            <a href="/dashboard?view=orders" class="bg-rc-card-hover/50 border border-rc-border/40 rounded-xl p-4 text-center hover:border-neon-cyan/30 transition-all duration-300 group">
                                <div class="w-10 h-10 rounded-xl bg-neon-cyan/10 border border-neon-cyan/20 flex items-center justify-center text-neon-cyan mx-auto mb-2"><i class="fa-solid fa-file-invoice text-sm"></i></div>
                                <p class="text-xs font-medium text-gray-300">View Orders</p>
                            </a>
                            <a href="/dashboard?view=analytics" class="bg-rc-card-hover/50 border border-rc-border/40 rounded-xl p-4 text-center hover:border-amber-400/30 transition-all duration-300 group">
                                <div class="w-10 h-10 rounded-xl bg-amber-400/10 border border-amber-400/20 flex items-center justify-center text-amber-400 mx-auto mb-2"><i class="fa-solid fa-chart-bar text-sm"></i></div>
                                <p class="text-xs font-medium text-gray-300">Analytics</p>
                            </a>
                            <a href="/dashboard?view=marketing" class="bg-rc-card-hover/50 border border-rc-border/40 rounded-xl p-4 text-center hover:border-neon-pink/30 transition-all duration-300 group">
                                <div class="w-10 h-10 rounded-xl bg-neon-pink/10 border border-neon-pink/20 flex items-center justify-center text-neon-pink mx-auto mb-2"><i class="fa-solid fa-megaphone text-sm"></i></div>
                                <p class="text-xs font-medium text-gray-300">Marketing</p>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ═══════ END OVERVIEW ═══════ -->

            <!-- ═══════════════════ ORDERS ═══════════════════ -->
            <div x-show="view === 'orders'">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-3">
                    <div>
                        <h2 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-box-archive text-neon-purple"></i> Orders Management</h2>
                        <p class="text-xs text-gray-500 font-mono mt-1" x-text="ordersList.length + ' orders'"></p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-4 mb-4">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="flex-1 relative">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
