                { id: 'settings', label: 'Settings', icon: 'fa-solid fa-sliders', href: '/dashboard?view=settings' },
            ],
            get currentPage() {
                const params = new URLSearchParams(window.location.search);
                const view = params.get('view') || 'overview';
                return this.navItems.find(i => !i.separator && i.id === view);
            },
            init() {
                const params = new URLSearchParams(window.location.search);
                const view = params.get('view') || 'overview';
                const found = this.navItems.find(i => !i.separator && i.id === view);
                if (found) this.activeNav = found.id;
            }
        };
    }
