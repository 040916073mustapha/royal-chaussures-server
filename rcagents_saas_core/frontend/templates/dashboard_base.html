<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Agents — ONE BRAIN . MANY HANDS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        neon: {
                            purple: '#A855F7',
                            'purple-dark': '#7C3AED',
                            cyan: '#06B6D4',
                            'cyan-dark': '#0891B2',
                            pink: '#EC4899',
                        },
                        rc: {
                            bg: '#0A0A0F',
                            card: '#111118',
                            'card-hover': '#1A1A25',
                            border: '#1E1E30',
                            'border-glow': '#2E2E50',
                            text: '#94A3B8',
                            'text-bright': '#E2E8F0',
                        }
                    },
                    boxShadow: {
                        'neon-purple': '0 0 15px -3px rgba(168,85,247,0.3)',
                        'neon-cyan': '0 0 15px -3px rgba(6,182,212,0.3)',
                        'neon-lg': '0 0 40px -8px rgba(168,85,247,0.15)',
                    }
                }
            }
        }
        document.documentElement.classList.add("dark");
    </script>
    <style>
        @keyframes pulse-glow { 0%,100%{opacity:0.4} 50%{opacity:1} }
        @keyframes wave-move { 0%{transform:translateY(0)} 50%{transform:translateY(-3px)} 100%{transform:translateY(0)} }
        .neuron-pulse { animation: pulse-glow 2s ease-in-out infinite; }
        .sidebar-scroll::-webkit-scrollbar { width: 3px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 10px; }
        .card-hover-glow:hover { box-shadow: 0 0 25px -5px rgba(168,85,247,0.15), 0 0 0 1px rgba(168,85,247,0.2); }
        .bg-grid { 
            background-image: 
                linear-gradient(rgba(168,85,247,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168,85,247,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .wave-bar { animation: wave-move 1.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-rc-bg text-rc-text antialiased font-sans" x-data="app()">
    <div class="flex h-screen overflow-hidden bg-grid relative">
        
        <!-- Scanline overlay -->
        <div class="pointer-events-none fixed inset-0 z-50 opacity-[0.02]" style="background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);"></div>

        <!-- SIDEBAR -->
        <aside class="w-64 bg-rc-card border-r border-rc-border/60 flex flex-col justify-between shadow-2xl relative z-30 shrink-0">
            <div class="flex flex-col h-full">
                <!-- Brand Header -->
                <div class="px-5 pt-6 pb-4 border-b border-rc-border/40 text-center relative overflow-hidden">
                    <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-32 h-32 bg-neon-purple/5 rounded-full blur-3xl"></div>
                    
                    <!-- Octopus Logo -->
                    <div class="relative mx-auto mb-2 w-11 h-11">
                        <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-[0_0_10px_rgba(168,85,247,0.4)]">
                            <defs>
                                <linearGradient id="octoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#A855F7"/>
                                    <stop offset="100%" stop-color="#06B6D4"/>
                                </linearGradient>
                                <filter id="glow">
                                    <feGaussianBlur stdDeviation="2" result="blur"/>
                                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                                </filter>
                            </defs>
                            <!-- Body -->
                            <ellipse cx="50" cy="42" rx="20" ry="18" fill="url(#octoGrad)" opacity="0.9" filter="url(#glow)"/>
                            <!-- Node dots on tentacle ends -->
                            <circle cx="12" cy="72" r="3.5" fill="none" stroke="url(#octoGrad)" stroke-width="1.5" opacity="0.5"/>
                            <circle cx="88" cy="72" r="3.5" fill="none" stroke="url(#octoGrad)" stroke-width="1.5" opacity="0.5"/>
                            <circle cx="18" cy="82" r="3" fill="none" stroke="url(#octoGrad)" stroke-width="1.5" opacity="0.4"/>
                            <circle cx="82" cy="82" r="3" fill="none" stroke="url(#octoGrad)" stroke-width="1.5" opacity="0.4"/>
                            <!-- Tentacles left -->
                            <path d="M32 48 Q22 60 14 68 Q8 74 12 78" stroke="url(#octoGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
                            <path d="M36 52 Q26 66 20 76 Q16 82 20 84" stroke="url(#octoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
                            <path d="M40 55 Q32 70 28 80" stroke="url(#octoGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
                            <!-- Tentacles right -->
                            <path d="M68 48 Q78 60 86 68 Q92 74 88 78" stroke="url(#octoGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
                            <path d="M64 52 Q74 66 80 76 Q84 82 80 84" stroke="url(#octoGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
                            <path d="M60 55 Q68 70 72 80" stroke="url(#octoGrad)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
                            <!-- Eyes -->
                            <ellipse cx="42" cy="38" rx="5" ry="6" fill="#0A0A0F"/>
                            <ellipse cx="58" cy="38" rx="5" ry="6" fill="#0A0A0F"/>
                            <ellipse cx="43" cy="36" rx="1.8" ry="2" fill="#06B6D4"/>
                            <ellipse cx="59" cy="36" rx="1.8" ry="2" fill="#06B6D4"/>
                            <!-- Neural pulses -->
                            <circle cx="50" cy="28" r="2" fill="#A855F7" class="neuron-pulse" style="animation-delay:0s"/>
                        </svg>
                    </div>
                    <h1 class="font-sans text-base font-bold tracking-wider">
                        <span class="bg-gradient-to-r from-neon-purple to-neon-cyan bg-clip-text text-transparent">RC AGENTS</span>
                    </h1>
                    <div class="w-8 h-[1.5px] mx-auto mt-1.5 bg-gradient-to-r from-transparent via-neon-purple/40 to-transparent"></div>
                    <p class="text-[9px] font-mono tracking-[0.25em] uppercase mt-1.5">
                        <span class="bg-gradient-to-r from-neon-purple to-neon-cyan bg-clip-text text-transparent">ONE BRAIN . MANY HANDS</span>
                    </p>
                </div>

                <!-- Navigation -->
                <nav class="flex-1 overflow-y-auto sidebar-scroll px-3 py-3 space-y-0.5">
                    <template x-for="item in navItems" :key="item.id">
                        <div>
                            <template x-if="item.separator">
                                <div class="pt-4 pb-1.5">
                                    <div class="text-[9px] uppercase font-semibold text-gray-600 px-3 tracking-widest" x-text="item.label"></div>
                                </div>
                            </template>
                            <template x-if="!item.separator">
                                <a :href="item.href"
                                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all duration-200 border border-transparent"
                                   :class="activeNav === item.id 
                                     ? 'bg-neon-purple/10 text-neon-purple border-neon-purple/30 shadow-[0_0_12px_-4px_rgba(168,85,247,0.2)]' 
                                     : 'text-gray-400 hover:text-gray-200 hover:bg-rc-card-hover/50 hover:border-rc-border/30'">
                                    <i :class="item.icon" class="w-5 text-center text-sm"></i>
                                    <span x-text="item.label"></span>
                                </a>
                            </template>
                        </div>
                    </template>
                </nav>

                <!-- AI Brain Status -->
                <div class="px-4 pb-4 pt-2">
                    <div class="bg-gradient-to-r from-rc-card-hover/80 to-rc-card border border-rc-border/60 rounded-xl p-3.5 transition-all duration-300 hover:shadow-neon-purple group relative overflow-hidden cursor-default">
                        <div class="absolute inset-0 bg-gradient-to-r from-neon-purple/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="relative flex items-center gap-3">
                            <div class="relative w-9 h-9 shrink-0">
                                <div class="absolute inset-0 bg-neon-purple/10 rounded-lg border border-neon-purple/20 flex items-center justify-center">
                                    <i class="fa-solid fa-brain text-neon-purple text-sm"></i>
                                </div>
                                <!-- Wave bars -->
                                <div class="absolute -bottom-1 left-0 right-0 flex justify-center gap-[2px]">
                                    <span class="w-0.5 h-2.5 bg-neon-cyan/60 rounded-full wave-bar" style="animation-delay:0s"></span>
                                    <span class="w-0.5 h-3.5 bg-neon-cyan/80 rounded-full wave-bar" style="animation-delay:0.3s"></span>
                                    <span class="w-0.5 h-2 bg-neon-cyan/60 rounded-full wave-bar" style="animation-delay:0.6s"></span>
                                </div>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-xs font-semibold text-gray-200">AI Brain</span>
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.5)]"></span>
                                </div>
                                <p class="text-[10px] font-mono text-gray-500 mt-0.5">Online · DeepSeek V4</p>
                            </div>
                            <div class="text-[10px] font-mono text-emerald-400/70">ACTIVE</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- TOP BAR -->
            <header class="bg-rc-card/80 backdrop-blur-sm border-b border-rc-border/40 px-6 py-3 flex items-center justify-between shrink-0 z-20">
                <div class="flex items-center gap-4">
                    <h2 class="text-sm font-semibold text-white flex items-center gap-2">
                        <template x-if="currentPage">
                            <span x-text="currentPage.label"></span>
                        </template>
                        <template x-if="!currentPage">
                            <span>Overview</span>
                        </template>
                    </h2>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Search -->
                    <div class="relative hidden md:block">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-500"></i>
                        <input type="text" placeholder="Search..." class="bg-rc-bg border border-rc-border/50 rounded-lg pl-8 pr-3 py-1.5 text-xs text-gray-300 placeholder-gray-600 focus:outline-none focus:border-neon-purple/40 w-48 transition-colors">
                        <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] font-mono text-gray-600 border border-rc-border/30 rounded px-1 py-0.5">⌘K</span>
                    </div>
                    <!-- Notifications -->
                    <button class="relative w-8 h-8 rounded-lg bg-rc-card-hover border border-rc-border/40 flex items-center justify-center text-gray-400 hover:text-neon-cyan transition-colors">
                        <i class="fa-regular fa-bell text-sm"></i>
                        <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-rose-500 rounded-full text-[8px] font-bold text-white flex items-center justify-center shadow-lg">3</span>
                    </button>
                    <!-- Help -->
                    <button class="w-8 h-8 rounded-lg bg-rc-card-hover border border-rc-border/40 flex items-center justify-center text-gray-400 hover:text-neon-purple transition-colors">
                        <i class="fa-regular fa-circle-question text-sm"></i>
                    </button>
                    <!-- Profile -->
                    <div class="flex items-center gap-2.5 pl-3 border-l border-rc-border/40">
                        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-neon-purple to-neon-cyan flex items-center justify-center text-white text-xs font-bold shadow-[0_0_10px_-2px_rgba(168,85,247,0.3)]">
                            <span x-text="userInitials">RC</span>
                        </div>
                        <div class="hidden sm:block">
                            <p class="text-xs font-medium text-gray-200 leading-tight" x-text="userName || 'Mustapha'">Mustapha</p>
                            <p class="text-[10px] text-gray-500 leading-tight font-mono" x-text="userRole || 'Admin'">Admin</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- CONTENT -->
            <main class="flex-1 overflow-y-auto">
                <div class="p-6 lg:p-8">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>

    </div>
    <script>
    function app() {
        return {
            userName: 'Merchant',
            userRole: 'Admin',
            userInitials: 'RC',
            activeNav: 'overview',
            navItems: [
                { id: 'overview', label: 'Overview', icon: 'fa-solid fa-chart-pie', href: '/dashboard' },
                { id: 'orders', label: 'Orders', icon: 'fa-solid fa-box-archive', href: '/dashboard/orders' },
                { id: 'customers', label: 'Customers', icon: 'fa-solid fa-users', href: '/dashboard/clients' },
                { id: 'products', label: 'Products', icon: 'fa-solid fa-tag', href: '/dashboard/products' },
                { separator: true, label: 'INTELLIGENCE' },
                { id: 'agents', label: 'AI Agents', icon: 'fa-solid fa-network-wired', href: '/dashboard/agents' },
                { id: 'chat', label: 'Live Chat', icon: 'fa-solid fa-comments', href: '/dashboard/chat' },
                { id: 'analytics', label: 'Analytics', icon: 'fa-solid fa-chart-line', href: '/dashboard/analytics' },
                { separator: true, label: 'OPERATIONS' },
                { id: 'marketing', label: 'Marketing', icon: 'fa-solid fa-bullhorn', href: '/dashboard/marketing' },
                { id: 'inventory', label: 'Inventory', icon: 'fa-solid fa-warehouse', href: '/dashboard/inventory' },
                { id: 'shipping', label: 'Shipping', icon: 'fa-solid fa-truck', href: '/dashboard/shipments' },
                { id: 'automations', label: 'Automations', icon: 'fa-solid fa-robot', href: '/dashboard/auto-ship' },
                { separator: true, label: 'SYSTEM' },
                { id: 'integrations', label: 'Integrations', icon: 'fa-solid fa-plug', href: '/dashboard/integrations' },
                { id: 'settings', label: 'Settings', icon: 'fa-solid fa-sliders', href: '/dashboard/settings' },
            ],
            get currentPage() {
                const path = window.location.pathname;
                return this.navItems.find(i => !i.separator && path.startsWith(i.href));
            },
            init() {
                const path = window.location.pathname;
                const found = this.navItems.find(i => !i.separator && path.startsWith(i.href));
                if (found) this.activeNav = found.id;

                // Load user info from local storage (set during onboarding/login)
                try {
                    const uname = localStorage.getItem('rc_user_name');
                    this.userName = uname && uname.trim() ? uname : 'Merchant';
                    this.userRole = localStorage.getItem('rc_user_role') || 'Admin';
                    if (this.userName) {
                        this.userInitials = this.userName.split(' ').map(s => s[0]).join('').substring(0, 2).toUpperCase();
                    }
                } catch(e) {
                    this.userName = 'Merchant';
                    this.userRole = 'Admin';
                }
                if (this.userName) {
                    this.userInitials = this.userName.split(' ').map(s => s[0]).join('').substring(0, 2).toUpperCase();
                }

                // Fallback: try fetching from API
                if (!this.userName) {
                    fetch('/api/auth/me')
                        .then(r => r.json())
                        .then(data => {
                            if (data.name) {
                                this.userName = data.name;
                                this.userRole = data.role || 'Admin';
                                this.userInitials = data.name.split(' ').map(s => s[0]).join('').substring(0, 2).toUpperCase();
                                localStorage.setItem('rc_user_name', data.name);
                                localStorage.setItem('rc_user_role', data.role || 'Admin');
                            }
                        })
                        .catch(() => {});
                }
            }
        };
    }
    </script>
</body>
</html>
