{% extends "dashboard_base.html" %}
{% block content %}
<div x-data="{ 
        clients: [], 
        search: '', 
        loading: true,
        get filteredClients() {
            if (!this.search) return this.clients;
            const q = this.search.toLowerCase();
            return this.clients.filter(c => 
                (c.name && c.name.toLowerCase().includes(q)) || 
                (c.phone && c.phone.includes(q)) || 
                (c.wilaya && c.wilaya.toLowerCase().includes(q))
            );
        }
     }" 
     x-init="fetch('/api/clients').then(r=>r.json()).then(d=>{ clients=d.clients||[]; loading=false; }).catch(()=>loading=false)">

    <!-- Top Header & Search Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-400 shadow-sm">
                <i class="fa-solid fa-users text-lg"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight font-serif flex items-center gap-2">
                    <span>سجل العملاء</span>
                    <span class="text-gold-400 text-sm">👑</span>
                </h1>
                <p class="text-xs text-gray-400 mt-0.5">قاعدة بيانات عملاء متجر Royal Chaussures وسجل مشترياتهم</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-80">
            <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-gold-500/60 text-xs"></i>
            <input type="text" 
                   x-model="search" 
                   placeholder="بحث بالاسم، الهاتف، أو الولاية..." 
                   class="w-full bg-luxury-card border border-gold-500/20 text-gray-200 text-xs rounded-xl py-2.5 pr-10 pl-4 focus:outline-none focus:border-gold-500/50 placeholder-gray-500 transition-all">
        </div>
    </div>

    <!-- Clients Table Container -->
    <div class="bg-luxury-card rounded-2xl border border-gold-500/20 overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
            <table class="w-full text-right border-collapse">
                <thead>
                    <tr class="bg-luxury-bg border-b border-gold-500/20 text-gold-400 text-xs font-serif uppercase tracking-wider">
                        <th class="p-4">اسم العميل</th>
                        <th class="p-4">رقم الهاتف</th>
                        <th class="p-4">الولاية</th>
                        <th class="p-4 text-center">عدد الطلبات</th>
                        <th class="p-4">إجمالي المشتريات</th>
                        <th class="p-4">تاريخ آخر طلب</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-dark-border/60 text-xs">
                    
                    <!-- Loading State Skeleton -->
                    <template x-if="loading">
                        <template x-for="i in 5">
                            <tr class="animate-pulse">
                                <td class="p-4"><div class="h-4 bg-luxury-hover rounded w-32"></div></td>
                                <td class="p-4"><div class="h-4 bg-luxury-hover rounded w-24"></div></td>
                                <td class="p-4"><div class="h-4 bg-luxury-hover rounded w-20"></div></td>
                                <td class="p-4"><div class="h-4 bg-luxury-hover rounded w-12 mx-auto"></div></td>
                                <td class="p-4"><div class="h-4 bg-luxury-hover rounded w-24"></div></td>
                                <td class="p-4"><div class="h-4 bg-luxury-hover rounded w-20"></div></td>
                            </tr>
                        </template>
                    </template>

                    <!-- Client Rows -->
                    <template x-for="c in filteredClients" :key="c.id">
                        <tr class="hover:bg-luxury-hover/60 transition-colors group">
                            
                            <!-- Name with Avatar -->
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-luxury-bg border border-gold-500/20 flex items-center justify-center text-gold-400 font-bold text-xs shadow-sm">
                                        <i class="fa-solid fa-user-tie"></i>
                                    </div>
                                    <span class="font-bold text-gray-100 group-hover:text-gold-300 transition-colors text-sm" x-text="c.name||'-'"></span>
                                </div>
                            </td>

                            <!-- Phone -->
                            <td class="p-4 font-mono text-gray-300 tracking-wider text-[11px]" x-text="c.phone||'-'"></td>

                            <!-- Wilaya -->
                            <td class="p-4">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-luxury-bg border border-dark-border text-gray-300 text-[11px] font-medium">
                                    <i class="fa-solid fa-location-dot text-[10px] text-gold-400"></i>
                                    <span x-text="c.wilaya||'-'"></span>
                                </span>
                            </td>

                            <!-- Orders Count -->
                            <td class="p-4 text-center">
                                <span class="inline-block px-2.5 py-0.5 rounded-md bg-gold-500/10 border border-gold-500/30 text-gold-300 font-bold text-xs" x-text="c.orders"></span>
                            </td>

                            <!-- Total Spent -->
                            <td class="p-4 font-extrabold text-gold-300 text-sm font-serif" x-text="(c.spent||0).toLocaleString()+' د.ج'"></td>

                            <!-- Last Order Date -->
                            <td class="p-4 text-gray-400 text-[11px]" x-text="c.last_order ? c.last_order.slice(0,10) : '-'"></td>
                        </tr>
                    </template>
                    
                    <!-- Empty State -->
                    <tr x-show="!loading && filteredClients.length === 0">
                        <td colspan="6" class="p-12 text-center text-gray-500">
                            <i class="fa-solid fa-users-slash text-3xl mb-2 opacity-30 text-gold-400"></i>
                            <p class="text-xs" x-text="search ? 'لا يوجد عملاء يطابقون خيارات البحث' : 'لا يوجد عملاء مسجلون بعد في النظام'"></p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
