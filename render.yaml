# RC Agents — SaaS Core Render Blueprint
# Multi-Tenant Backend + PostgreSQL

services:
  # ─── Web Service ────────────────────────────────────────────
  - type: web
    name: rcagents-saas-core
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --env AI_MODEL=openai/deepseek-ai/DeepSeek-V4-Flash
    healthCheckPath: /api/health
    envVars:
      - key: SAAS_DATABASE_URL
        fromDatabase:
          name: rcagents-db
          property: connectionString
      - key: SAAS_JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: AI_MODEL
        value: openai/deepseek-ai/DeepSeek-V4-Flash

  # ─── PostgreSQL Database ────────────────────────────────────
  - type: postgresql
    name: rcagents-db
    region: frankfurt
    plan: free
    version: 16
    ipAllowList: []
