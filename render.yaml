# RC Agents â€” SaaS Core Render Blueprint
# Multi-Tenant Backend + PostgreSQL

services:
  # â”€â”€â”€ Web Service â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - type: web
    name: rcagents-saas-core
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --env AI_MODEL=Qwen/Qwen3-VL-30B-A3B-Instruct
    healthCheckPath: /api/health
    envVars:
      - key: SAAS_DATABASE_URL
        fromDatabase:
          name: rcagents-db
          property: connectionString
      - key: SAAS_JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: AI_MODEL
        value: Qwen/Qwen3-VL-30B-A3B-Instruct

  # â”€â”€â”€ PostgreSQL Database â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - type: postgresql
    name: rcagents-db
    region: frankfurt
    plan: free
    version: 16
    ipAllowList: []

