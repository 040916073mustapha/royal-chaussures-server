{% extends "dashboard_base.html" %}
{% block content %}
<div x-data="{ 
        products: [], 
        search: '', 
        loading: true,
        get filteredProducts() {
            if (!this.search) return this.products;
            return this.products.filter(p => p.title.toLowerCase().includes(this.search.toLowerCase()));
        }
     }" 
     x-init="fetch('/api/products').then(r=>r.json()).then(d=>{ products=d.products||[]; loading=false; }).catch(()=>loading=false)">
    
    <!-- Header & Search -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-royal-600/20 border border-royal-500/30 flex items-center justify-center text-royal-400">
                <i class="fa-solid fa-shoe-prints text-lg"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">المنتجات والمخزون</h1>
                <p class="text-xs text-gray-400 mt-0.5">إدارة كتالوج المنتجات والمخزون المتاح في المتجر</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full md:w-80">
            <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="text" 
                   x-model="search" 
                   placeholder="بحث عن منتج بالاسم..." 
                   class="w-full bg-dark-card border border-dark-border text-gray-200 text-sm rounded-xl py-2.5 pr-10 pl-4 focus:outline-none focus:border-royal-500/60 focus:ring-1 focus:ring-royal-500/60 placeholder-gray-500 transition-all">
        </div>
    </div>

    <!-- Skeleton Loading -->
    <div x-show="loading" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
        <template x-for="i in 10">
            <div class="bg-dark-card border border-dark-border rounded-2xl p-3 animate-pulse">
                <div class="aspect-[3/4] bg-dark-hover rounded-xl mb-3"></div>
                <div class="h-4 bg-dark-hover rounded w-3/4 mb-2"></div>
                <div class="h-4 bg-dark-hover rounded w-1/2"></div>
            </div>
        </template>
    </div>

    <!-- Vertical Product Cards Grid (3:4 Ratio) -->
    <div x-show="!loading && filteredProducts.length > 0" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-5">
        <template x-for="p in filteredProducts" :key="p.id">
            <div class="bg-dark-card rounded-2xl border border-dark-border/80 overflow-hidden hover:border-royal-500/50 hover:shadow-xl hover:shadow-royal-950/30 transition-all duration-300 flex flex-col group">
                
                <!-- Portrait Image Container (3/4 Ratio) -->
                <div class="relative w-full aspect-[3/4] bg-dark-bg overflow-hidden flex items-center justify-center border-b border-dark-border/40">
                    <img :src="p.image" 
                         :alt="p.title" 
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" 
                         x-show="p.image">
                    
                    <div x-show="!p.image" class="flex flex-col items-center justify-center text-gray-600">
                        <i class="fa-solid fa-shoe-prints text-3xl mb-1 opacity-40"></i>
                        <span class="text-[11px] font-medium text-gray-600">لا توجد صورة</span>
                    </div>

                    <!-- Floating Stock Badge -->
                    <div class="absolute top-2.5 right-2.5 bg-dark-bg/85 backdrop-blur-md border border-white/10 px-2 py-1 rounded-lg flex items-center gap-1.5 shadow-md">
                        <span class="w-1.5 h-1.5 rounded-full" :class="p.stock > 0 ? 'bg-emerald-400' : 'bg-rose-500'"></span>
                        <span class="text-[11px] font-bold text-gray-200" x-text="p.stock + ' قطعة'"></span>
                    </div>
                </div>

                <!-- Product Details (Below Image) -->
                <div class="p-3.5 flex flex-col justify-between flex-1 gap-2.5">
                    <div>
                        <h3 class="font-bold text-gray-100 text-sm leading-snug group-hover:text-royal-300 transition-colors line-clamp-1" x-text="p.title"></h3>
                        <p class="text-[11px] text-gray-400 mt-1 flex items-center gap-1">
                            <i class="fa-solid fa-layer-group text-[10px] text-royal-400"></i>
                            <span x-text="p.variants + ' مقاسات'"></span>
                        </p>
                    </div>

                    <!-- Price Footer -->
                    <div class="pt-2 border-t border-dark-border/60 flex items-center justify-between mt-auto">
                        <span class="text-[11px] text-gray-400 font-medium">السعر</span>
                        <span class="text-sm font-extrabold text-royal-300" 
                              x-text="(p.price_min==p.price_max ? p.price_min.toLocaleString() : p.price_min.toLocaleString()+' - '+p.price_max.toLocaleString()) + ' د.ج'">
                        </span>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="!loading && filteredProducts.length === 0" class="bg-dark-card border border-dark-border rounded-2xl p-12 text-center max-w-md mx-auto my-12 shadow-xl">
        <div class="w-16 h-16 rounded-2xl bg-dark-hover border border-dark-border flex items-center justify-center mx-auto mb-4 text-gray-500 text-2xl">
            <i class="fa-solid fa-boxes-spin"></i>
        </div>
        <h3 class="text-lg font-bold text-gray-200 mb-1">لم يتم العثور على أي منتج</h3>
        <p class="text-xs text-gray-500" x-text="search ? 'جرب البحث بكلمة أخرى' : 'لا توجد منتجات مسجلة حالياً في النظام'"></p>
    </div>

</div>
{% endblock %}
