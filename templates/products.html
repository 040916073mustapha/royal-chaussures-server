<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Chaussures — المنتجات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root{--gold:#D4AF37;--gold-light:#E8C95A;--bg-primary:#08080f;--bg-card:rgba(255,255,255,0.03);--border-subtle:rgba(255,255,255,0.06);--border-gold:rgba(212,175,55,0.25);--text-primary:#f0f0f0;--text-secondary:#8888a0;--text-muted:#555570;--glow-gold:0 0 20px rgba(212,175,55,0.15);--sidebar-width:240px;--radius-card:16px;--radius-sm:10px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh}
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-thumb{background:rgba(212,175,55,0.25);border-radius:3px}
        .sidebar{position:fixed;top:0;right:0;width:var(--sidebar-width);height:100vh;background:rgba(10,10,20,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border-gold);padding:28px 16px;z-index:100;display:flex;flex-direction:column}
        .sidebar .logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;padding:8px 12px}
        .sidebar .logo::after{content:'👑';font-size:14px;-webkit-text-fill-color:initial;margin-right:6px}
        .sidebar .logo small{display:block;font-family:'Inter',sans-serif;font-size:11px;-webkit-text-fill-color:var(--text-muted);background:none;margin-top:2px}
        .sidebar .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin:24px 12px 8px;font-weight:600}
        .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 14px;color:var(--text-secondary);text-decoration:none;border-radius:var(--radius-sm);margin-bottom:2px;font-size:14px;font-weight:500;transition:all 0.3s;position:relative}
        .sidebar a::before{content:'';position:absolute;right:-16px;top:50%;transform:translateY(-50%) scaleY(0);width:3px;height:24px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));transition:transform 0.3s}
        .sidebar a:hover,.sidebar a.active{background:rgba(212,175,55,0.08);color:var(--gold-light)}
        .sidebar a:hover::before,.sidebar a.active::before{transform:translateY(-50%) scaleY(1)}
        .sidebar-footer{margin-top:auto;padding:16px 14px;border-top:1px solid rgba(255,255,255,0.04);font-size:12px;color:var(--text-muted)}
        .pulse-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulseDot 2s ease-in-out infinite}
        @keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.5)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(34,197,94,0)}}
        .main{margin-right:var(--sidebar-width);padding:28px 32px;min-height:100vh}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.04)}
        .header h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;background:linear-gradient(135deg,#fff 30%,var(--gold-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header a{color:var(--gold-light);text-decoration:none;font-size:13px;font-weight:500;padding:6px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-gold);background:rgba(212,175,55,0.05);transition:0.3s}
        .header a:hover{background:rgba(212,175,55,0.12)}
        .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
        .product-card{background:linear-gradient(135deg,var(--bg-card),rgba(255,255,255,0.01));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:20px;transition:all 0.4s;position:relative;overflow:hidden}
        .product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent);opacity:0;transition:0.4s}
        .product-card:hover::before{opacity:0.5}
        .product-card:hover{transform:translateY(-4px);border-color:rgba(212,175,55,0.15);box-shadow:0 12px 40px rgba(0,0,0,0.3),var(--glow-gold)}
        .product-card .title{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .product-card .price{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--gold-light),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .product-card .meta{font-size:12px;color:var(--text-muted);margin-top:8px;display:flex;align-items:center;gap:4px}
        .product-card .sku{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:monospace}
        .loading{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:48px}
        @media(max-width:768px){.sidebar{transform:translateX(100%)}.main{margin-right:0;padding:20px 16px;padding-top:68px}.header{flex-direction:column;gap:12px}.header h1{font-size:20px}.product-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
        @media(max-width:480px){.product-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Royal Chaussures<small>Premium Command Center</small></div>
        <div class="nav-label">🛠 العمليات</div>
        <a href="/dashboard"><i class="fas fa-chart-pie icon"></i> لوحة التحكم</a>
        <a href="/dashboard/orders"><i class="fas fa-box icon"></i> الطلبات</a>
        <a href="/dashboard/products" class="active"><i class="fas fa-shoe-prints icon"></i> المنتجات</a>
        <a href="/dashboard/tracking"><i class="fas fa-search icon"></i> تتبع الشحنات</a>
        <div class="nav-label">🧠 الذكاء</div>
        <a href="/dashboard/constellation" target="_blank"><i class="fas fa-globe icon"></i> Agent Constellation</a>
        <a href="/health"><i class="fas fa-heart icon"></i> صحة السيرفر</a>
        <div class="sidebar-footer"><span class="pulse-dot"></span> <span id="serverUrl">Online</span></div>
    </div>
    <div class="main">
        <div class="header">
            <h1>🛍️ المنتجات</h1>
            <a href="/dashboard"><i class="fas fa-arrow-right"></i> العودة للوحة التحكم</a>
        </div>
        <div class="product-grid" id="productsGrid">
            <div class="loading">⏳ جار التحميل...</div>
        </div>
    </div>
    <script>
        function loadProducts(){fetch('/api/products').then(function(r){return r.json()}).then(function(d){var g=document.getElementById('productsGrid');if(!d.products||!d.products.length){g.innerHTML='<div class="loading">لا توجد منتجات</div>';return}g.innerHTML=d.products.map(function(p){var v=p.variants&&p.variants[0];var price=v?parseFloat(v.price).toLocaleString()+' DZD':'0 DZD';var variants=p.variants?p.variants.length+' مقاس':'0 مقاس';return'<div class="product-card"><div class="title">'+(p.title||'')+'</div><div class="price">'+price+'</div><div class="meta"><i class="fas fa-tag"></i> '+variants+'</div>'+(v&&v.sku?'<div class="sku">SKU: '+v.sku+'</div>':'')+'</div>'}).join('')}).catch(function(e){document.getElementById('productsGrid').innerHTML='<div class="loading" style="color:#ef4444;">⚠️ فشل التحميل</div>'})}
        document.addEventListener('DOMContentLoaded',function(){loadProducts();document.getElementById('serverUrl').textContent=window.location.origin});
    </script>
</body>
</html>
