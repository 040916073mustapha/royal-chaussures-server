{% extends "dashboard_base.html" %}
{% block content %}
<div x-data="{ stats: {}, orders: [], msgs: [], loading: true, convCount: 0 }" 
     x-init="Promise.all([
        fetch('/api/stats').then(r=>r.json()).then(d=>stats=d).catch(()=>{}),
        fetch('/api/orders').then(r=>r.json()).then(d=>orders=d.orders||[]).catch(()=>{}),
        fetch('/api/messages?limit=200').then(r=>r.json()).then(d=>{ if(d.success){ msgs=d.messages; let s=new Set(); d.messages.forEach(m=>s.add(m.sender_id+'|'+m.platform)); convCount=s.size } }).catch(()=>{})
     ]).finally(()=>loading=false)">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-3">
                <span>Overview</span>
                <span class="text-xs font-mono text-neon-purple/60 font-normal bg-neon-purple/5 px-2 py-0.5 rounded border border-neon-purple/20">v2.0</span>
            </h1>
            <p class="text-xs text-gray-500 mt-1 font-mono flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.5)]"></span>
                <span x-text="new Date().toLocaleDateString('fr-FR', { weekday:'long', year:'numeric', month:'long', day:'numeric' })"></span>
                <span class="text-gray-600">|</span>
                <span>All systems online</span>
            </p>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-rc-card border border-rc-border/60 px-3 py-1.5 rounded-lg text-[10px] text-gray-400 font-mono flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span>
                <span>LIVE</span>
            </div>
            <button class="bg-rc-card-hover border border-rc-border/60 hover:border-neon-purple/30 text-gray-400 hover:text-neon-purple rounded-lg px-3 py-1.5 text-xs transition-all">
                <i class="fa-solid fa-rotate mr-1"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div x-show="loading" class="py-20 text-center">
        <div class="inline-flex items-center gap-3 text-gray-500">
            <i class="fa-solid fa-circle-notch text-neon-purple text-xl animate-spin"></i>
            <span class="text-sm font-mono">LOADING NEURAL INTERFACE...</span>
        </div>
    </div>

    <template x-if="!loading">
        <div>
            <!-- Key Metrics Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                <!-- Revenue -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-neon-purple/5 to-transparent rounded-bl-full"></div>
                    <div class="relative">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Total Revenue</span>
                            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-purple/10 to-neon-cyan/10 border border-neon-purple/20 flex items-center justify-center text-neon-purple group-hover:shadow-[0_0_12px_-4px_rgba(168,85,247,0.3)] transition-shadow">
                                <i class="fa-solid fa-coins text-sm"></i>
                            </div>
                        </div>
                        <p class="text-2xl font-bold text-white font-mono" x-text="(stats.revenue||0).toLocaleString() + ' DZD'"></p>
                        <div class="mt-2 flex items-center gap-1.5">
                            <span class="text-[10px] font-mono text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded"><i class="fa-solid fa-arrow-up mr-0.5"></i> total</span>
                            <span class="text-[10px] text-gray-500">Shopify confirmed</span>
                        </div>
                    </div>
                </div>

                <!-- Orders -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300 relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-24 h-24 bg-gradient-to-br from-neon-cyan/5 to-transparent rounded-br-full"></div>
                    <div class="relative">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Total Orders</span>
                            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-cyan/10 to-neon-purple/10 border border-neon-cyan/20 flex items-center justify-center text-neon-cyan group-hover:shadow-[0_0_12px_-4px_rgba(6,182,212,0.3)] transition-shadow">
                                <i class="fa-solid fa-bag-shopping text-sm"></i>
                            </div>
                        </div>
                        <p class="text-2xl font-bold text-white font-mono" x-text="stats.total_orders || 0"></p>
                        <div class="mt-2 flex items-center gap-1.5">
                            <span class="text-[10px] font-mono text-neon-cyan bg-neon-cyan/10 px-1.5 py-0.5 rounded" x-text="(stats.delivered||0)+' delivered'"></span>
                            <span class="text-[10px] text-gray-500">·</span>
                            <span class="text-[10px] text-gray-500" x-text="(stats.pending||0)+' pending'"></span>
                        </div>
                    </div>
                </div>

                <!-- Customers -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300 group">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Customers</span>
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-neon-pink/10 to-neon-purple/10 border border-neon-pink/20 flex items-center justify-center text-neon-pink group-hover:shadow-[0_0_12px_-4px_rgba(236,72,153,0.3)] transition-shadow">
                            <i class="fa-solid fa-users text-sm"></i>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white font-mono" x-text="stats.clients_count || 0"></p>
                    <div class="mt-2 flex items-center gap-1.5">
                        <span class="text-[10px] text-gray-500">Registered clients</span>
                    </div>
                </div>

                <!-- Conversion Rate -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300 group">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider">Conversion</span>
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-amber-400/10 to-neon-purple/10 border border-amber-400/20 flex items-center justify-center text-amber-400 group-hover:shadow-[0_0_12px_-4px_rgba(251,191,36,0.3)] transition-shadow">
                            <i class="fa-solid fa-arrow-trend-up text-sm"></i>
                        </div>
                    </div>
                    <p class="text-2xl font-bold text-white font-mono" x-text="(stats.delivery_rate||0)+'%'"></p>
                    <div class="mt-2 flex items-center gap-1.5">
                        <span class="text-[10px] font-mono text-emerald-400 bg-emerald-400/10 px-1.5 py-0.5 rounded"><i class="fa-solid fa-check mr-0.5"></i> delivery rate</span>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8">
                <!-- Revenue Chart (2 cols) -->
                <div class="lg:col-span-2 bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-sm font-semibold text-white">Revenue Overview</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5 font-mono">Monthly performance</p>
                        </div>
                        <div class="flex gap-1">
                            <span class="w-2.5 h-2.5 rounded-full bg-neon-purple shadow-[0_0_6px_rgba(168,85,247,0.4)]"></span>
                            <span class="text-[10px] text-gray-500 font-mono">Revenue</span>
                        </div>
                    </div>
                    <div class="relative h-48">
                        <canvas x-init="
                            setTimeout(()=>{
                                const ctx = $el.getContext('2d');
                                new Chart(ctx, {
                                    type: 'line',
                                    data: {
                                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                                        datasets: [{
                                            label: 'Revenue',
                                            data: [28000, 35000, 42000, 38000, 51000, 47000, 62000, 58000, 73000, 69000, 85000, stats.revenue||92000],
                                            borderColor: '#A855F7',
                                            backgroundColor: (ctx) => {
                                                const g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 200);
                                                g.addColorStop(0, 'rgba(168,85,247,0.25)');
                                                g.addColorStop(1, 'rgba(168,85,247,0)');
                                                return g;
                                            },
                                            fill: true,
                                            tension: 0.4,
                                            pointRadius: 3,
                                            pointBackgroundColor: '#A855F7',
                                            pointBorderColor: '#0A0A0F',
                                            pointBorderWidth: 2,
                                            borderWidth: 2,
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        plugins: { legend: { display: false } },
                                        scales: {
                                            x: { 
                                                grid: { color: 'rgba(30,30,48,0.5)', drawBorder: false },
                                                ticks: { color: '#64748B', font: { size: 9, family: 'JetBrains Mono' } }
                                            },
                                            y: { 
                                                grid: { color: 'rgba(30,30,48,0.5)', drawBorder: false },
                                                ticks: { 
                                                    color: '#64748B', font: { size: 9, family: 'JetBrains Mono' },
                                                    callback: v => v/1000 + 'k'
                                                }
                                            }
                                        },
                                        interaction: { intersect: false, mode: 'index' }
                                    }
                                });
                            }, 100)
                        "></canvas>
                    </div>
                </div>

                <!-- Sales by Channel Donut -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-sm font-semibold text-white">Sales by Channel</h3>
                            <p class="text-[10px] text-gray-500 mt-0.5 font-mono">Revenue distribution</p>
                        </div>
                    </div>
                    <div class="relative h-48 flex items-center justify-center">
                        <canvas x-init="
                            setTimeout(()=>{
                                const ctx = $el.getContext('2d');
                                new Chart(ctx, {
                                    type: 'doughnut',
                                    data: {
                                        labels: ['Online Store', 'Instagram', 'Facebook', 'WhatsApp'],
                                        datasets: [{
                                            data: [45, 25, 18, 12],
                                            backgroundColor: ['#A855F7', '#EC4899', '#3B82F6', '#22C55E'],
                                            borderColor: '#0A0A0F',
                                            borderWidth: 3,
                                            hoverOffset: 6,
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        cutout: '62%',
                                        plugins: {
                                            legend: {
                                                position: 'bottom',
                                                labels: {
                                                    color: '#94A3B8',
                                                    font: { size: 9, family: 'JetBrains Mono' },
                                                    padding: 10,
                                                    usePointStyle: true,
                                                    pointStyle: 'circle',
                                                }
                                            }
                                        }
                                    }
                                });
                            }, 100)
                        "></canvas>
                    </div>
                    <!-- Stats -->
                    <div class="mt-2 grid grid-cols-2 gap-2 text-center">
                        <div class="bg-rc-card-hover/50 rounded-lg p-2">
                            <p class="text-[10px] font-mono text-gray-500">Online</p>
                            <p class="text-xs font-bold text-neon-purple font-mono">45%</p>
                        </div>
                        <div class="bg-rc-card-hover/50 rounded-lg p-2">
                            <p class="text-[10px] font-mono text-gray-500">Social</p>
                            <p class="text-xs font-bold text-neon-pink font-mono">55%</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: Recent Orders + AI Agents -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <!-- Recent Orders (2 cols) -->
                <div class="lg:col-span-2 bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-rc-border/40">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-receipt text-neon-purple text-xs"></i>
                            <h3 class="text-sm font-semibold text-white">Recent Orders</h3>
                        </div>
                        <a href="/dashboard/orders" class="text-[10px] font-mono text-neon-purple hover:text-neon-cyan transition-colors flex items-center gap-1">
                            View all <i class="fa-solid fa-arrow-left text-[9px]"></i>
                        </a>
                    </div>

                    <!-- Loading -->
                    <div x-show="loading" class="py-6 text-center text-gray-500 text-xs animate-pulse font-mono">LOADING...</div>

                    <!-- Empty -->
                    <template x-if="!loading && orders.length === 0">
                        <div class="text-center py-8 text-gray-500">
                            <i class="fa-solid fa-inbox text-2xl mb-2 opacity-30"></i>
                            <p class="text-xs font-mono">No orders yet</p>
                        </div>
                    </template>

                    <!-- Orders List -->
                    <div x-show="!loading && orders.length > 0" class="space-y-1">
                        <template x-for="o in orders.slice(0,8)" :key="o.id">
                            <div class="flex items-center justify-between py-2.5 px-3 rounded-lg hover:bg-rc-card-hover/50 transition-colors border border-transparent hover:border-rc-border/30">
                                <div class="flex items-center gap-3 min-w-0">
                                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rc-card-hover to-rc-card border border-rc-border/40 flex items-center justify-center text-gray-500 text-xs font-mono shrink-0">
                                        <i class="fa-solid fa-receipt"></i>
                                    </div>
                                    <div class="min-w-0">
                                        <p class="text-sm font-medium text-gray-200 truncate" x-text="o.customer||'Guest'"></p>
                                        <p class="text-[10px] text-gray-500 font-mono truncate" x-text="(o.product||'') + (o.variant?' · '+o.variant:'')"></p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3 shrink-0">
                                    <span class="text-[10px] font-mono font-bold px-2 py-1 rounded border capitalize"
                                          :class="{
                                            'bg-emerald-400/10 text-emerald-400 border-emerald-400/30': o.status==='Confirme',
                                            'bg-yellow-400/10 text-yellow-400 border-yellow-400/30': o.status==='Nouveau'||o.status==='Pending',
                                            'bg-rose-400/10 text-rose-400 border-rose-400/30': o.status==='Annule'||o.status==='Cancelled',
                                            'bg-sky-400/10 text-sky-400 border-sky-400/30': o.status==='Livre'||o.status==='Delivered'
                                          }"
                                          x-text="o.status">
                                    </span>
                                    <span class="text-xs font-mono font-bold text-white" x-text="(o.total||0).toLocaleString() + ' DZD'"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- AI Agents Status -->
                <div class="bg-rc-card border border-rc-border/60 rounded-xl p-5 card-hover-glow transition-all duration-300">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-rc-border/40">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-network-wired text-neon-cyan text-xs"></i>
                            <h3 class="text-sm font-semibold text-white">AI Agents</h3>
                        </div>
                        <span class="text-[10px] font-mono text-emerald-400 flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span x-text="convCount>0?convCount+' active':'online'"></span>
                        </span>
                    </div>

                    <div class="space-y-3">
                        <!-- Messenger Agent -->
                        <div class="bg-rc-card-hover/50 rounded-lg p-3 border border-rc-border/30">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 text-sm">
                                    <i class="fab fa-facebook-messenger"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs font-semibold text-gray-200">Messenger</span>
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span>
                                    </div>
                                    <p class="text-[10px] font-mono text-gray-500 mt-0.5">DeepSeek-V4 · Vision</p>
                                </div>
                                <div class="text-[10px] font-mono text-emerald-400/70">ACTIVE</div>
                            </div>
                        </div>

                        <!-- WhatsApp Agent -->
                        <div class="bg-rc-card-hover/50 rounded-lg p-3 border border-rc-border/30">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-sm">
                                    <i class="fab fa-whatsapp"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs font-semibold text-gray-200">WhatsApp</span>
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span>
                                    </div>
                                    <p class="text-[10px] font-mono text-gray-500 mt-0.5">DeepSeek-V4 · Vision</p>
                                </div>
                                <div class="text-[10px] font-mono text-emerald-400/70">ACTIVE</div>
                            </div>
                        </div>

                        <!-- Instagram Agent -->
                        <div class="bg-rc-card-hover/50 rounded-lg p-3 border border-rc-border/30">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-400 text-sm">
                                    <i class="fab fa-instagram"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs font-semibold text-gray-200">Instagram</span>
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span>
                                    </div>
                                    <p class="text-[10px] font-mono text-gray-500 mt-0.5">DeepSeek-V4 · Vision</p>
                                </div>
                                <div class="text-[10px] font-mono text-emerald-400/70">ACTIVE</div>
                            </div>
                        </div>

                        <!-- Shopify Sync -->
                        <div class="bg-rc-card-hover/50 rounded-lg p-3 border border-rc-border/30">
                            <div class="flex items-center gap-2.5">
                                <div class="w-8 h-8 rounded-lg bg-neon-purple/10 border border-neon-purple/20 flex items-center justify-center text-neon-purple text-sm">
                                    <i class="fa-solid fa-rotate"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs font-semibold text-gray-200">Shopify Sync</span>
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_6px_rgba(52,211,153,0.4)]"></span>
                                    </div>
                                    <p class="text-[10px] font-mono text-gray-500 mt-0.5">Inventory · Orders</p>
                                </div>
                                <div class="text-[10px] font-mono text-emerald-400/70">LIVE</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}
