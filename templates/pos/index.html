<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Royal POS — كاشير المحل</title>
    <link rel="manifest" href="/static/pos/manifest.json">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ============================================
                   ROYAL POS — Dark Neon Cyberpunk Theme
                   ============================================ */
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3e;
            --bg-input: #1e1e42;
            --text-primary: #e0e0ff;
            --text-secondary: #8888bb;
            --text-muted: #5555aa;
            --accent-pink: #ff2d78;
            --accent-cyan: #00d4ff;
            --accent-gold: #ffd700;
            --accent-green: #00ff88;
            --border-color: #2a2a5e;
            --shadow-color: rgba(255, 45, 120, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-pink); border-radius: 4px; }
        
        /* ============================================
                   Login Screen
                   ============================================ */
        #login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
        }
        #login-screen.hidden { display: none; }
        
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 40px var(--shadow-color);
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo i {
            font-size: 48px;
            color: var(--accent-gold);
        }
        .login-logo h1 {
            font-size: 24px;
            font-weight: 900;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 5px;
        }
        
        .login-form input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            direction: ltr;
            text-align: left;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 45, 120, 0.3);
        }
        .login-form input::placeholder {
            color: var(--text-muted);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-pink), #ff6b9d);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-family: 'Tajawal', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 45, 120, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            transform: none;
        }
        
        .login-error {
            color: var(--accent-pink);
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        
        /* ============================================
                   Main POS Layout
                   ============================================ */
        #pos-app { display: none; }
        #pos-app.active { display: block; }
        
        .pos-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 60px 1fr 80px;
            min-height: 100vh;
            gap: 0;
        }
        
        /* Header */
        .pos-header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .pos-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 18px;
        }
        .pos-header .brand i { color: var(--accent-gold); }
        .pos-header .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .pos-header .user-info .role-badge {
            background: var(--accent-pink);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
        .btn-logout:hover {
            color: var(--accent-pink);
            border-color: var(--accent-pink);
        }
        
        /* ============================================
                   Left Panel — Products & Cart
                   ============================================ */
        .pos-left {
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }
        
        /* Search & Barcode Input */
        .pos-search {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .pos-search input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
        }
        .pos-search input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }
        .pos-search input#barcode-input {
            font-size: 20px;
            letter-spacing: 2px;
            direction: ltr;
            text-align: center;
        }
        
        /* Quick Categories */
        .pos-categories {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .cat-btn {
            padding: 6px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--accent-pink);
            color: white;
            border-color: var(--accent-pink);
        }
        
        /* Products Grid */
        .pos-products {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            padding: 5px 0;
        }
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .product-card:hover {
            border-color: var(--accent-pink);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        .product-card:active {
            transform: scale(0.97);
        }
        .product-card .price {
            color: var(--accent-gold);
            font-size: 18px;
            font-weight: 900;
        }
        .product-card .name {
            font-size: 13px;
            margin: 5px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card .stock {
            font-size: 11px;
            color: var(--text-muted);
        }
        .product-card .stock.low { color: var(--accent-pink); }
        .product-card .stock.out { color: #ff4444; }
        
        /* ============================================
                   Right Panel — Cart
                   ============================================ */
        .pos-right {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-header h3 { font-size: 16px; }
        .cart-header .count {
            background: var(--accent-pink);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        
        .cart-items {
            flex: 1;
            overflow-y: auto;
        }
        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 8px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(42, 42, 94, 0.5);
            font-size: 14px;
        }
        .cart-item .item-name { 
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cart-item .item-qty {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .cart-item .item-qty button {
            width: 24px; height: 24px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-item .item-qty button:hover { background: var(--accent-pink); }
        .cart-item .item-qty span { min-width: 24px; text-align: center; }
        .cart-item .item-total { color: var(--accent-gold); font-weight: 700; }
        .cart-item .item-remove {
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
        }
        .cart-item .item-remove:hover { color: var(--accent-pink); }
        
        .cart-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
        }
        .cart-empty i { font-size: 48px; margin-bottom: 10px; }
        
        /* Cart Summary */
        .cart-summary {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: auto;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .summary-row.total {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-gold);
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            margin-top: 8px;
        }
        
        /* Payment & Action Buttons */
        .cart-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .cart-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-checkout {
            background: linear-gradient(135deg, var(--accent-green), #00cc77);
            color: #000;
        }
        .btn-checkout:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,255,136,0.3); }
        .btn-checkout:disabled { opacity: 0.4; transform: none; }
        
        .btn-clear {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color) !important;
            max-width: 60px;
        }
        .btn-clear:hover { color: var(--accent-pink); border-color: var(--accent-pink); }
        
        /* ============================================
                   Bottom Bar (Mobile)
                   ============================================ */
        .pos-bottom {
            grid-column: 1 / -1;
            display: none;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            align-items: center;
            justify-content: space-between;
        }
        .pos-bottom .cart-total-mobile {
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-gold);
        }
        .pos-bottom .btn-cart-toggle {
            background: var(--accent-pink);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
        }
        .pos-bottom .btn-cart-toggle .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-gold);
            color: #000;
            width: 20px; height: 20px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* ============================================
                   Payment Modal
                   ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 30px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 0 50px var(--shadow-color);
        }
        .modal-box h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .modal-box .receipt-total {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-gold);
            margin: 15px 0;
        }
        .modal-box .receipt-items {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .modal-box .receipt-items .r-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .modal-box .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 15px 0;
        }
        .modal-box .payment-methods button {
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-box .payment-methods button:hover,
        .modal-box .payment-methods button.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.1);
        }
        
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-box .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-secondary);
            border: 1px solid var(--border-color) !important;
        }
        .btn-secondary:hover { color: var(--text-primary); border-color: var(--accent-pink); }
        
        /* ============================================
                   Receipt Modal (after sale)
                   ============================================ */
        .receipt-done { text-align: center; }
        .receipt-done i {
            font-size: 64px;
            color: var(--accent-green);
            margin-bottom: 15px;
        }
        .receipt-done .receipt-number {
            font-size: 16px;
            color: var(--text-secondary);
        }
        .btn-print {
            background: var(--accent-cyan);
            color: #000;
        }
        .btn-print:hover { box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3); }
        
        /* ============================================
                   Loading Spinner
                   ============================================ */
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid var(--bg-card);
            border-top-color: var(--accent-pink);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 24px;
            z-index: 2000;
            display: none;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .toast.show { display: block; animation: fadeInUp 0.3s; }
        .toast.success { border-color: var(--accent-green); }
        .toast.error { border-color: var(--accent-pink); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        /* ============================================
                   Responsive
                   ============================================ */
        @media (max-width: 768px) {
            .pos-container {
                grid-template-columns: 1fr;
                grid-template-rows: 60px 1fr 80px;
            }
            .pos-right {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                z-index: 500;
                border-left: none;
            }
            .pos-right.active {
                display: flex;
            }
            .pos-right .cart-header .btn-close {
                background: transparent;
                border: none;
                color: var(--text-secondary);
                font-size: 24px;
                cursor: pointer;
            }
            .pos-bottom { display: flex; }
            .pos-products {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        
        @media (max-width: 480px) {
            .login-box { padding: 25px; }
            .pos-header .brand span { display: none; }
        }
    </style>
</head>
<body>

<!-- ============================================
     LOGIN SCREEN
     ============================================ -->
<div id="login-screen">
    <div class="login-box">
        <div class="login-logo">
            <i class="fas fa-crown"></i>
            <h1>Royal POS</h1>
            <p>نظام إدارة المحل</p>
        </div>
        <div class="login-form">
            <input type="text" id="login-user" placeholder="اسم المستخدم" autocomplete="username" autofocus>
            <input type="password" id="login-pass" placeholder="كلمة السر" autocomplete="current-password">
            <button class="btn-primary" id="login-btn" onclick="login()">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
            <div class="login-error" id="login-error"></div>
        </div>
    </div>
</div>

<!-- ============================================
     MAIN POS APPLICATION
     ============================================ -->
<div id="pos-app">
    <div class="pos-container">
        
        <!-- Header -->
        <header class="pos-header">
            <div class="brand">
                <i class="fas fa-crown"></i>
                <span>Royal POS</span>
            </div>
            <div class="user-info">
                <i class="fas fa-user"></i>
                <span id="user-name">مدير المحل</span>
                <span class="role-badge" id="user-role">Store</span>
                <span id="connection-status" title="حالة الاتصال">
                    <i class="fas fa-wifi"></i>
                </span>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>
        
        <!-- LEFT Panel — Products -->
        <div class="pos-left">
            <div class="pos-search">
                <input type="text" id="barcode-input" placeholder="📷 امسح الباركود..." 
                       autocomplete="off" inputmode="none"
                       onkeydown="handleBarcode(event)">
                <input type="text" id="search-input" placeholder="🔍 بحث في المنتجات..." 
                       oninput="searchProducts(this.value)" autocomplete="off">
            </div>
            
            <div class="pos-categories" id="categories">
                <button class="cat-btn active" onclick="filterCategory('all')">الكل</button>
            </div>
            
            <div class="pos-products" id="products-grid">
                <!-- تتحمّل ديناميكياً -->
            </div>
        </div>
        
        <!-- RIGHT Panel — Cart -->
        <div class="pos-right" id="cart-panel">
            <div class="cart-header">
                <h3>🧾 سلة المشتريات</h3>
                <span class="count" id="cart-count">0</span>
                <button class="btn-close" onclick="toggleCart()" style="display:none;">✕</button>
            </div>
            
            <div class="cart-items" id="cart-items">
                <div class="cart-empty" id="cart-empty">
                    <i class="fas fa-shopping-cart"></i>
                    <p>السلة فارغة</p>
                    <p style="font-size:12px;">امسح باركود أو اختر منتج</p>
                </div>
            </div>
            
            <div class="cart-summary" id="cart-summary" style="display:none;">
                <div class="summary-row">
                    <span>عدد القطع</span>
                    <span id="cart-total-items">0</span>
                </div>
                <div class="summary-row total">
                    <span>الإجمالي</span>
                    <span id="cart-total">0 DA</span>
                </div>
                <div class="cart-actions">
                    <button class="btn-clear" onclick="clearCart()" title="تفريغ">
                        <i class="fas fa-trash"></i>
                    </button>
                    <button class="btn-checkout" id="btn-checkout" onclick="openCheckout()">
                        <i class="fas fa-check"></i> إتمام البيع
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Bottom Bar (Mobile) -->
        <div class="pos-bottom">
            <div class="cart-total-mobile" id="mobile-total">0 DA</div>
            <button class="btn-cart-toggle" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i> السلة
                <span class="badge" id="mobile-cart-count">0</span>
            </button>
        </div>
    </div>
</div>

<!-- ============================================
     PAYMENT MODAL
     ============================================ -->
<div class="modal-overlay" id="payment-modal">
    <div class="modal-box" id="payment-modal-box">
        <!-- Payment Form -->
        <div id="payment-form">
            <h2>💳 إتمام البيع</h2>
            <div class="receipt-total" id="payment-total">0 DA</div>
            
            <div class="receipt-items" id="payment-items"></div>
            
            <div style="margin:15px 0;">
                <label style="color:var(--text-secondary);font-size:13px;">ملاحظات (اختياري)</label>
                <input type="text" id="payment-notes" placeholder="ملاحظة..." 
                       style="width:100%;padding:10px;background:var(--bg-input);border:1px solid var(--border-color);
                              border-radius:var(--radius-sm);color:var(--text-primary);font-family:'Tajawal',sans-serif;">
            </div>
            
            <div class="payment-methods">
                <button class="active" data-method="cash" onclick="selectPayment('cash')">
                    <i class="fas fa-money-bill-wave"></i> نقدي
                </button>
                <button data-method="card" onclick="selectPayment('card')">
                    <i class="fas fa-credit-card"></i> بطاقة
                </button>
                <button data-method="bank_transfer" onclick="selectPayment('bank_transfer')">
                    <i class="fas fa-university"></i> تحويل
                </button>
                <button data-method="check" onclick="selectPayment('check')">
                    <i class="fas fa-money-check"></i> شيك
                </button>
            </div>
            
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('payment-modal')">إلغاء</button>
                <button class="btn-primary" onclick="completeSale()" id="btn-complete-sale">
                    <i class="fas fa-check-circle"></i> تأكيد البيع
                </button>
            </div>
        </div>
        
        <!-- After Sale Success -->
        <div id="payment-success" style="display:none;">
            <div class="receipt-done">
                <i class="fas fa-check-circle"></i>
                <h2>✅ تم البيع بنجاح!</h2>
                <div class="receipt-total" id="success-total">0 DA</div>
                <div class="receipt-number" id="success-receipt">رقم الفاتورة: ---</div>
                <div class="modal-actions" style="margin-top:30px;">
                    <button class="btn-print" onclick="printReceipt()">
                        <i class="fas fa-print"></i> طباعة الفاتورة
                    </button>
                    <button class="btn-primary" onclick="closeModal('payment-modal'); resetSale();">
                        <i class="fas fa-plus-circle"></i> بيع جديد
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>
