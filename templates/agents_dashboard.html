<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Agents - Agents Dashboard 🤖</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
        * { font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
        .glass-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; transition: all 0.3s; }
        .glass-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .agent-active { box-shadow: 0 0 20px rgba(59,130,246,0.3), inset 0 0 20px rgba(59,130,246,0.05); }
        .neon-glow { text-shadow: 0 0 20px rgba(59,130,246,0.5); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .sidebar-item { transition: all 0.2s; border-radius: 12px; cursor: pointer; }
        .sidebar-item:hover { background: rgba(255,255,255,0.05); }
        .sidebar-item.active { background: rgba(59,130,246,0.15); border-right: 3px solid #3b82f6; }
        .code-area { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.6; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .tab-btn { padding: 8px 18px; border-radius: 10px; transition: all 0.2s; font-weight: 500; cursor: pointer; }
        .tab-btn.active { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .kpi-card { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .prompt-editor { min-height: 200px; resize: vertical; width: 100%; padding: 16px; color: #e6edf3; background: #0d1117; border: 1px solid #30363d; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.7; outline: none; }
        .prompt-editor:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a2e; border: 1px solid rgba(59,130,246,0.3); padding: 14px 28px; border-radius: 14px; color: #e6edf3; font-weight: 500; z-index: 9999; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: all 0.4s; opacity: 0; pointer-events: none; }
        .toast.show { opacity: 1; pointer-events: auto; }
        .toast.success { border-color: rgba(34,197,94,0.4); }
        .toast.error { border-color: rgba(239,68,68,0.4); }
        
        /* Dark chart areas */
        .chart-bar { height: 24px; border-radius: 6px; transition: width 1s ease; min-width: 2px; }
    </style>
</head>
<body>
    <div class="flex h-screen" x-data="agentsDashboard()" x-init="init()">
        <!-- Toast -->
        <div id="toast" class="toast" :class="toastClass" x-text="toastMsg" x-show="toastShow" x-transition.duration.400ms></div>

        <!-- Sidebar -->
        <div class="w-64 h-full glass border-l border-white/5 flex flex-col shrink-0" style="background:#0d0d1f">
            <div class="p-5 border-b border-white/5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-lg font-bold text-white">🤖</div>
                    <div>
                        <div class="text-white font-bold text-sm">RC Agents</div>
                        <div class="text-gray-500 text-xs">v2.3 · 6 Agents</div>
                    </div>
                </div>
            </div>
            
            <div class="p-3 flex-1 overflow-y-auto">
                <div class="text-gray-500 text-xs font-medium mb-3 px-3">الوكلاء</div>
                
                <template x-for="agent in agents" :key="agent.id">
                    <div class="sidebar-item flex items-center gap-3 px-3 py-2.5 mb-1"
                         :class="{ active: selectedAgent == agent.id }"
                         @click="selectAgent(agent.id)">
                        <span x-text="agent.emoji"></span>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm text-white truncate" x-text="agent.name"></div>
                            <div class="text-xs text-gray-500 truncate" x-text="agent.name_en"></div>
                        </div>
                        <div class="status-dot shrink-0" :style="`background: ${agent.active ? '#22c55e' : agent.color}`"></div>
                    </div>
                </template>

                <div class="text-gray-500 text-xs font-medium mb-3 mt-6 px-3">التقارير</div>
                <div class="sidebar-item flex items-center gap-3 px-3 py-2.5 mb-1"
                     :class="{ active: selectedAgent == 'analytics' }"
                     @click="selectedAgent = 'analytics'; showAnalytics()">
                    <span>📊</span>
                    <div class="text-sm text-white">لوحة التحليلات</div>
                </div>
            </div>
            
            <div class="p-4 border-t border-white/5">
                <div class="text-gray-500 text-xs text-center">Royal Chaussures 👠</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto p-6" style="background: #0a0a1a">
            <!-- Agent Detail View -->
            <template x-if="selectedAgent && selectedAgent != 'analytics'">
                <div>
                    <!-- Header -->
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-4">
                            <span class="text-4xl" x-text="currentAgent.emoji"></span>
                            <div>
                                <h1 class="text-2xl font-bold text-white neon-glow" x-text="currentAgent.name"></h1>
                                <p class="text-gray-400 text-sm" x-text="currentAgent.description"></p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button @click="savePrompt()" 
                                    class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-sm font-medium transition-all duration-200 flex items-center gap-2">
                                💾 حفظ التغييرات
                            </button>
                            <button @click="resetPrompt()"
                                    class="px-5 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-sm transition-all duration-200">
                                🔄 استعادة
                            </button>
                        </div>
                    </div>

                    <!-- Agent Status Cards -->
                    <div class="grid grid-cols-4 gap-4 mb-6">
                        <div class="kpi-card">
                            <div class="text-gray-400 text-xs mb-1">الحالة</div>
                            <div class="text-white font-bold flex items-center gap-2">
                                <div class="w-2.5 h-2.5 rounded-full" :style="`background: ${currentAgent.active ? '#22c55e' : '#6b7280'}`"></div>
                                <span x-text="currentAgent.active ? '🟢 نشط' : '⚪ غير نشط'"></span>
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="text-gray-400 text-xs mb-1">نوع الوكيل</div>
                            <div class="text-white font-bold" x-text="currentAgent.id"></div>
                        </div>
                        <div class="kpi-card">
                            <div class="text-gray-400 text-xs mb-1">الكلمات المفتاحية</div>
                            <div class="text-white font-bold" x-text="(currentAgent.keywords || []).length"></div>
                        </div>
                        <div class="kpi-card">
                            <div class="text-gray-400 text-xs mb-1">Shopify Data</div>
                            <div class="text-white font-bold" x-text="currentAgent.needs_shopify_data ? '✅ متصل' : '❌ غير متصل'"></div>
                        </div>
                    </div>

                    <!-- Agent Config Tabs -->
                    <div class="glass-card p-6 mb-6">
                        <div class="flex gap-2 mb-5 border-b border-white/5 pb-3">
                            <div class="tab-btn" :class="{ active: activeTab == 'prompt' }" @click="activeTab = 'prompt'">📝 System Prompt</div>
                            <div class="tab-btn" :class="{ active: activeTab == 'keywords' }" @click="activeTab = 'keywords'">🔑 الكلمات المفتاحية</div>
                            <div class="tab-btn" :class="{ active: activeTab == 'auto' }" @click="activeTab = 'auto'">⚡ الردود التلقائية</div>
                        </div>

                        <!-- Prompt Tab -->
                        <template x-if="activeTab == 'prompt'">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <div class="text-white text-sm font-medium">System Prompt — يتحكم في شخصية وسلوك الوكيل</div>
                                    <div class="text-gray-500 text-xs" x-text="`${(currentPrompt || '').length} حرف`"></div>
                                </div>
                                <textarea class="prompt-editor" x-model="currentPrompt" spellcheck="false"></textarea>
                            </div>
                        </template>

                        <!-- Keywords Tab -->
                        <template x-if="activeTab == 'keywords'">
                            <div>
                                <div class="text-white text-sm font-medium mb-3">الكلمات المفتاحية التي تنشط هذا الوكيل</div>
                                <div class="flex flex-wrap gap-2">
                                    <template x-for="kw in (currentAgent.keywords || [])" :key="kw">
                                        <span class="px-3 py-1.5 bg-white/5 rounded-lg text-sm text-gray-300 border border-white/5">🔑 <span x-text="kw"></span></span>
                                    </template>
                                </div>
                                <div class="mt-4 text-gray-500 text-xs">إجمالي: <span x-text="(currentAgent.keywords || []).length"></span> كلمة مفتاحية</div>
                            </div>
                        </template>

                        <!-- Auto-reply Tab -->
                        <template x-if="activeTab == 'auto'">
                            <div>
                                <div class="text-white text-sm font-medium mb-3">الردود التلقائية السريعة</div>
                                <div class="space-y-2 max-h-96 overflow-y-auto">
                                    <template x-for="(reply, keyword) in (currentAgent.auto_reply_map || {})" :key="keyword">
                                        <div class="flex gap-3 p-3 bg-white/5 rounded-xl">
                                            <div class="text-orange-400 font-bold text-sm shrink-0 w-24 truncate" x-text="'🔑 '+keyword"></div>
                                            <div class="text-gray-300 text-sm" x-text="reply"></div>
                                        </div>
                                    </template>
                                    <div x-show="!currentAgent.auto_reply_map || Object.keys(currentAgent.auto_reply_map).length == 0" class="text-gray-500 text-center py-6">لا توجد ردود تلقائية لهذا الوكيل</div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Test the Agent -->
                    <div class="glass-card p-6">
                        <h3 class="text-white font-bold mb-3">🧪 اختبار الوكيل</h3>
                        <div class="flex gap-3 mb-3">
                            <input type="text" x-model="testMessage" @keyup.enter="testAgent()"
                                   class="flex-1 px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white text-sm outline-none focus:border-blue-500/50 transition-all"
                                   placeholder="اكتب رسالة اختبارية...">
                            <button @click="testAgent()" 
                                    class="px-5 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl text-sm font-medium transition-all">
                                🚀 اختبار
                            </button>
                        </div>
                        <template x-if="testResult">
                            <div class="p-4 bg-white/5 rounded-xl mt-3">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="text-gray-400 text-xs">الكشف:</span>
                                    <span class="badge" :style="`background: ${testResult.agent_color}20; color: ${testResult.agent_color}`" x-text="testResult.agent_emoji + ' ' + testResult.agent_name"></span>
                                </div>
                                <div class="text-gray-300 text-sm leading-relaxed whitespace-pre-wrap" x-text="testResult.test_reply || 'جاري توليد الرد...'"></div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Analytics Dashboard -->
            <template x-if="selectedAgent == 'analytics'">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-white neon-glow">📊 لوحة التحليلات</h1>
                            <p class="text-gray-400 text-sm">تقارير المبيعات والأداء</p>
                        </div>
                        <div class="flex gap-2">
                            <button @click="analyticsPeriod = 'daily'; loadAnalytics()"
                                    class="tab-btn text-sm" :class="{ active: analyticsPeriod == 'daily' }">📅 يومي</button>
                            <button @click="analyticsPeriod = 'weekly'; loadAnalytics()"
                                    class="tab-btn text-sm" :class="{ active: analyticsPeriod == 'weekly' }">📅 أسبوعي</button>
                            <button @click="analyticsPeriod = 'monthly'; loadAnalytics()"
                                    class="tab-btn text-sm" :class="{ active: analyticsPeriod == 'monthly' }">📅 شهري</button>
                        </div>
                    </div>

                    <!-- KPI Cards -->
                    <div class="grid grid-cols-5 gap-4 mb-6">
                        <div class="kpi-card text-center">
                            <div class="text-3xl font-bold text-white mb-1" x-text="analyticsData.current_orders || 0"></div>
                            <div class="text-gray-400 text-xs">📦 الطلبات</div>
                        </div>
                        <div class="kpi-card text-center">
                            <div class="text-3xl font-bold text-green-400 mb-1" x-text="(analyticsData.current_revenue || 0).toLocaleString()"></div>
                            <div class="text-gray-400 text-xs">💰 الإيرادات</div>
                        </div>
                        <div class="kpi-card text-center">
                            <div class="text-2xl font-bold mb-1" :class="analyticsData.growth >= 0 ? 'text-emerald-400' : 'text-red-400'" x-text="(analyticsData.growth || 0).toFixed(1) + '%'"></div>
                            <div class="text-gray-400 text-xs">📈 النمو</div>
                        </div>
                        <div class="kpi-card text-center">
                            <div class="text-2xl font-bold text-orange-400 mb-1" x-text="(analyticsData.avg_order || 0).toLocaleString()"></div>
                            <div class="text-gray-400 text-xs">💳 متوسط الطلب</div>
                        </div>
                        <div class="kpi-card text-center">
                            <div class="text-xl font-bold text-purple-400 mb-1" x-text="(analyticsData.prev_orders || 0)"></div>
                            <div class="text-gray-400 text-xs">📋 الفترة السابقة</div>
                        </div>
                    </div>

                    <!-- Top Products + Charts -->
                    <div class="grid grid-cols-2 gap-6 mb-6">
                        <div class="glass-card p-5">
                            <h3 class="text-white font-bold mb-4">🏆 الأكثر مبيعاً</h3>
                            <template x-if="analyticsTopProducts.length == 0">
                                <div class="text-gray-500 text-center py-8">لا توجد بيانات كافية</div>
                            </template>
                            <template x-for="(product, i) in analyticsTopProducts" :key="i">
                                <div class="mb-4">
                                    <div class="flex items-center justify-between mb-1.5">
                                        <div class="flex items-center gap-2">
                                            <span class="text-sm" x-text="['🥇','🥈','🥉'][i] || `${i+1}.`"></span>
                                            <span class="text-white text-sm font-medium truncate max-w-[200px]" x-text="product.name"></span>
                                        </div>
                                        <span class="text-gray-400 text-xs" x-text="product.revenue.toLocaleString() + ' د.ج'"></span>
                                    </div>
                                    <div class="w-full bg-white/5 rounded-full h-2 overflow-hidden">
                                        <div class="chart-bar bg-gradient-to-r from-blue-500 to-purple-500 h-full"
                                             :style="`width: ${(product.revenue / maxRevenue * 100)}%`"></div>
                                    </div>
                                    <div class="text-gray-500 text-xs mt-0.5" x-text="product.count + ' قطعة'"></div>
                                </div>
                            </template>
                        </div>

                        <div class="glass-card p-5">
                            <h3 class="text-white font-bold mb-4">📊 مقارنة الفترات</h3>
                            <div class="space-y-6">
                                <div>
                                    <div class="flex justify-between text-sm mb-2">
                                        <span class="text-gray-400">الفترة الحالية</span>
                                        <span class="text-white font-bold" x-text="(analyticsData.current_revenue || 0).toLocaleString() + ' د.ج'"></span>
                                    </div>
                                    <div class="w-full bg-white/5 rounded-full h-4 overflow-hidden">
                                        <div class="chart-bar bg-gradient-to-r from-blue-500 to-cyan-400 h-full" style="width: 100%"></div>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-sm mb-2">
                                        <span class="text-gray-400">الفترة السابقة</span>
                                        <span class="text-gray-300 font-bold" x-text="(analyticsData.prev_revenue || 0).toLocaleString() + ' د.ج'"></span>
                                    </div>
                                    <div class="w-full bg-white/5 rounded-full h-4 overflow-hidden">
                                        <div class="chart-bar bg-gradient-to-r from-gray-500 to-gray-400 h-full"
                                             :style="`width: ${analyticsData.prev_revenue && analyticsData.current_revenue ? (analyticsData.prev_revenue / analyticsData.current_revenue * 100) + '%' : '50%'}`"></div>
                                    </div>
                                </div>
                                <div class="pt-3 text-center">
                                    <span class="text-sm font-bold" :class="analyticsData.growth >= 0 ? 'text-emerald-400' : 'text-red-400'">
                                        <span x-text="analyticsData.growth >= 0 ? '📈 +' : '📉 '"></span><span x-text="(analyticsData.growth || 0).toFixed(1)"></span>% عن الفترة السابقة
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Agent Performance -->
                    <div class="glass-card p-5">
                        <h3 class="text-white font-bold mb-4">🤖 أداء الوكلاء</h3>
                        <div class="grid grid-cols-3 gap-4">
                            <template x-for="agent in agents" :key="agent.id">
                                <div class="p-4 bg-white/5 rounded-xl">
                                    <div class="flex items-center gap-2 mb-2">
                                        <span x-text="agent.emoji"></span>
                                        <span class="text-white text-sm font-medium" x-text="agent.name"></span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-gray-500">الحالة:</span>
                                        <span :class="agent.active ? 'text-green-400' : 'text-gray-400'" x-text="agent.active ? '🟢 نشط' : '⚪ غير نشط'"></span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs mt-1">
                                        <span class="text-gray-500">الكلمات:</span>
                                        <span class="text-gray-300" x-text="(agent.keywords || []).length"></span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs mt-1">
                                        <span class="text-gray-500">اللون:</span>
                                        <span class="w-4 h-4 rounded-full inline-block" :style="`background: ${agent.color}`"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
        function agentsDashboard() {
            return {
                agents: [],
                selectedAgent: null,
                activeTab: 'prompt',
                currentPrompt: '',
                testMessage: '',
                testResult: null,
                toastMsg: '',
                toastShow: false,
                toastClass: '',
                analyticsPeriod: 'daily',
                analyticsData: {},
                analyticsTopProducts: [],
                prevAnalyticsData: {},

                get currentAgent() {
                    return this.agents.find(a => a.id == this.selectedAgent) || {};
                },

                async init() {
                    await this.loadAgents();
                    // Default to first agent
                    if (this.agents.length > 0) {
                        this.selectAgent(this.agents[0].id);
                    }
                },

                async loadAgents() {
                    try {
                        const res = await fetch('/api/agents/config');
                        const data = await res.json();
                        this.agents = data.available_agents || [];
                    } catch(e) {
                        this.showToast('⚠️ فشل تحميل الوكلاء', 'error');
                    }
                },

                selectAgent(agentId) {
                    this.selectedAgent = agentId;
                    this.activeTab = 'prompt';
                    this.testMessage = '';
                    this.testResult = null;
                    
                    const agent = this.agents.find(a => a.id == agentId);
                    if (agent) {
                        this.currentPrompt = agent.system_prompt || '';
                    }
                },

                async savePrompt() {
                    if (!this.currentAgent || !this.currentAgent.id) return;
                    
                    try {
                        const res = await fetch('/api/store/prompts', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                store_id: 1,
                                prompt_type: this.currentAgent.id,
                                prompt_text: this.currentPrompt
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            // Update local agent data
                            const agent = this.agents.find(a => a.id == this.currentAgent.id);
                            if (agent) agent.system_prompt = this.currentPrompt;
                            this.showToast('✅ تم حفظ الـ System Prompt بنجاح!', 'success');
                        } else {
                            this.showToast('⚠️ فشل الحفظ: ' + (data.error || 'خطأ غير معروف'), 'error');
                        }
                    } catch(e) {
                        this.showToast('⚠️ فشل الاتصال بالخادم', 'error');
                    }
                },

                resetPrompt() {
                    if (this.currentAgent && this.currentAgent.system_prompt) {
                        this.currentPrompt = this.currentAgent.system_prompt;
                        this.showToast('🔄 تم استعادة النظام الأصلي', 'success');
                    }
                },

                async testAgent() {
                    if (!this.testMessage.trim()) return;
                    
                    try {
                        const res = await fetch('/api/agents/detect', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                message: this.testMessage,
                                platform: 'dashboard',
                                uid: 'admin_test'
                            })
                        });
                        const data = await res.json();
                        
                        // Generate a sample reply based on agent
                        let testReply = '';
                        const agent = this.agents.find(a => a.id == data.agent_id);
                        if (agent && agent.auto_reply_map) {
                            const keys = Object.keys(agent.auto_reply_map);
                            for (let kw of keys) {
                                if (this.testMessage.includes(kw)) {
                                    testReply = agent.auto_reply_map[kw];
                                    break;
                                }
                            }
                            if (!testReply && keys.length > 0) {
                                testReply = agent.auto_reply_map[keys[0]] || 
                                    `✅ تم الكشف: ${agent.name} — سيقوم بالرد تلقائياً على هذه الرسالة.`;
                            }
                        }
                        
                        this.testResult = {
                            ...data,
                            test_reply: testReply || `✅ تم توجيه الرسالة إلى وكيل ${data.agent_name} بنجاح.`
                        };
                    } catch(e) {
                        this.showToast('⚠️ فشل الاختبار', 'error');
                    }
                },

                async showAnalytics() {
                    this.selectedAgent = 'analytics';
                    await this.loadAnalytics();
                },

                async loadAnalytics() {
                    try {
                        const res = await fetch(`/api/analytics/sales-summary?period=${this.analyticsPeriod}&store_id=1`);
                        const data = await res.json();
                        
                        this.analyticsData = {
                            current_orders: data.current_period?.orders || 0,
                            current_revenue: data.current_period?.revenue || 0,
                            prev_orders: data.previous_period?.orders || 0,
                            prev_revenue: data.previous_period?.revenue || 0,
                            avg_order: data.current_period?.orders > 0 ? 
                                Math.round(data.current_period.revenue / data.current_period.orders) : 0,
                            growth: data.previous_period?.revenue > 0 ?
                                ((data.current_period.revenue - data.previous_period.revenue) / data.previous_period.revenue * 100) : 0
                        };
                        
                        this.analyticsTopProducts = data.top_products || [];
                        this.prevAnalyticsData = data.previous_period || {};
                    } catch(e) {
                        // Keep previous data if available
                    }
                },

                get maxRevenue() {
                    if (this.analyticsTopProducts.length == 0) return 1;
                    return Math.max(...this.analyticsTopProducts.map(p => p.revenue), 1);
                },

                showToast(msg, type = '') {
                    this.toastMsg = msg;
                    this.toastClass = type;
                    this.toastShow = true;
                    setTimeout(() => { this.toastShow = false; }, 3000);
                }
            }
        }
    </script>
</body>
</html>
