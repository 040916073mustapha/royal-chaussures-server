<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Chaussures — Agent Constellation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root{--gold:#D4AF37;--gold-light:#E8C95A;--gold-dark:#B8962A;--bg-primary:#050510;--border-subtle:rgba(255,255,255,0.06);--border-gold:rgba(212,175,55,0.25);--text-primary:#f0f0f0;--text-secondary:#8888a0;--text-muted:#555570;--sidebar-width:240px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);overflow:hidden;height:100vh;display:flex}
        .sidebar{position:fixed;top:0;right:0;width:var(--sidebar-width);height:100vh;background:rgba(10,10,20,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--border-gold);padding:28px 16px;z-index:100;display:flex;flex-direction:column}
        .sidebar .logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--gold-light),var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;padding:8px 12px}
        .sidebar .logo::after{content:'🌌';font-size:16px;-webkit-text-fill-color:initial;margin-right:6px}
        .sidebar .logo small{display:block;font-family:'Inter',sans-serif;font-size:11px;-webkit-text-fill-color:var(--text-muted);background:none;margin-top:2px}
        .sidebar .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin:24px 12px 8px;font-weight:600}
        .sidebar a{display:flex;align-items:center;gap:12px;padding:11px 14px;color:var(--text-secondary);text-decoration:none;border-radius:10px;margin-bottom:2px;font-size:14px;font-weight:500;transition:all 0.3s;position:relative}
        .sidebar a::before{content:'';position:absolute;right:-16px;top:50%;transform:translateY(-50%) scaleY(0);width:3px;height:24px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--gold-light),var(--gold-dark));transition:transform 0.3s}
        .sidebar a:hover,.sidebar a.active{background:rgba(212,175,55,0.08);color:var(--gold-light)}
        .sidebar a:hover::before,.sidebar a.active::before{transform:translateY(-50%) scaleY(1)}
        .sidebar a .icon{width:20px;text-align:center}
        .sidebar-footer{margin-top:auto;padding:16px 14px;border-top:1px solid rgba(255,255,255,0.04);font-size:12px;color:var(--text-muted)}
        .pulse-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;animation:pulseDot 2s ease-in-out infinite}
        @keyframes pulseDot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,0.5)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(34,197,94,0)}}
        .canvas-wrap{margin-right:var(--sidebar-width);width:calc(100vw - var(--sidebar-width));height:100vh;position:relative}
        canvas{display:block;width:100%;height:100%}
        .info-panel{position:fixed;bottom:24px;left:280px;background:rgba(10,10,20,0.88);border:1px solid var(--border-gold);border-radius:16px;padding:20px 24px;min-width:280px;max-width:380px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;z-index:50;transition:opacity 0.3s}
        .info-panel.visible{display:block}
        .info-panel .close{float:left;cursor:pointer;color:var(--text-muted);font-size:20px;transition:0.2s}
        .info-panel .close:hover{color:var(--gold-light)}
        .info-panel h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif}
        .info-panel .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
        .info-panel .stat .val{color:var(--text-primary);font-weight:600}
        .info-panel .stat .tag{padding:1px 8px;border-radius:10px;font-size:10px}
        .tag-success{background:rgba(34,197,94,0.15);color:#22c55e}
        .tag-warning{background:rgba(234,179,8,0.15);color:#eab308}
        .tag-primary{background:rgba(13,110,253,0.15);color:#3b82f6}
        .scope-corner{position:fixed;z-index:10;pointer-events:none;opacity:0.15}
        .scope-corner.tl{top:16px;right:calc(var(--sidebar-width) + 16px);border-top:1px solid var(--gold);border-right:1px solid var(--gold);width:40px;height:40px}
        .scope-corner.br{bottom:16px;left:16px;border-bottom:1px solid #0dcaf0;border-left:1px solid #0dcaf0;width:40px;height:40px}
        .constellation-title{position:fixed;top:16px;right:calc(var(--sidebar-width) + 16px);color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:6px;text-transform:uppercase;z-index:15;font-weight:300;font-family:'Inter',sans-serif}
        .constellation-title strong{background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        @media(max-width:768px){.sidebar{width:160px}.sidebar .logo{font-size:15px}.sidebar a{font-size:11px;padding:8px 10px}.canvas-wrap{margin-right:160px;width:calc(100vw - 160px)}.info-panel{left:180px;min-width:200px}}
        .sidebar-social{padding:8px 14px;margin-bottom:4px;display:flex;gap:6px;justify-content:center}
        .sidebar-social a{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);border:1px solid var(--border-subtle);text-decoration:none;font-size:16px;transition:all .3s}
        .sidebar-social a:hover{transform:translateY(-2px)}
        .sidebar-social a.facebook:hover{background:rgba(24,119,242,.15);color:#1877F2;border-color:#1877F2}
        .sidebar-social a.instagram:hover{background:rgba(225,48,108,.15);color:#E1306C;border-color:#E1306C}
        .sidebar-social a.whatsapp:hover{background:rgba(37,211,102,.15);color:#25D366;border-color:#25D366}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Royal Chaussures<small>Constellation Network</small></div>
        <div class="nav-label">🛠 العمليات</div>
        <a href="/dashboard"><i class="fas fa-chart-pie icon"></i> لوحة التحكم</a>
        <a href="/dashboard/orders"><i class="fas fa-box icon"></i> الطلبات</a>
        <a href="/dashboard/products"><i class="fas fa-shoe-prints icon"></i> المنتجات</a>
        <a href="/dashboard/tracking"><i class="fas fa-search icon"></i> تتبع الشحنات</a>
        <div class="nav-label">🧠 الذكاء والمحادثات</div>
        <a href="/dashboard/chat"><i class="fas fa-comments icon"></i> المحادثات الحية 💬</a>
        <a href="/dashboard/constellation" class="active" target="_blank"><i class="fas fa-globe icon"></i> Agent Constellation</a>
        <a href="/health"><i class="fas fa-heart icon"></i> صحة السيرفر</a>
        <div class="sidebar-social">
            <a href="https://facebook.com/royalchaussures" target="_blank" class="facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://instagram.com/royalchaussures" target="_blank" class="instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/213659832426" target="_blank" class="whatsapp" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <div class="sidebar-footer"><span class="pulse-dot"></span> <span id="serverUrl">Live</span></div>
    </div>

    <div class="canvas-wrap"><canvas id="constellation"></canvas></div>
    <div class="scope-corner tl"></div>
    <div class="scope-corner br"></div>
    <div class="constellation-title"><strong>ROYAL CHAUSSURES</strong> // AGENT CONSTELLATION</div>

    <div class="info-panel" id="infoPanel">
        <span class="close" onclick="hideInfo()">&times;</span>
        <h3 id="infoTitle">Node</h3>
        <div id="infoStats"></div>
    </div>

    <script>
        const canvas=document.getElementById('constellation'),ctx=canvas.getContext('2d');let W,H;
        function resize(){W=canvas.width=canvas.clientWidth*window.devicePixelRatio;H=canvas.height=canvas.clientHeight*window.devicePixelRatio;ctx.scale(window.devicePixelRatio,window.devicePixelRatio)}
        resize();window.addEventListener('resize',resize);
        const cx=()=>(window.innerWidth-240)/2,cy=()=>window.innerHeight/2;
        const NODES=[
            {id:'shopify_core',label:'Shopify Core',x:()=>cx(),y:()=>cy(),r:44,color:'#e94560',type:'core',pulse:false,connections:[]},
            {id:'customer_support',label:'🤝 خدمة العملاء',x:()=>cx()+200,y:()=>cy()-80,r:34,color:'#0d6efd',type:'agent',pulse:false,connections:['shopify_core','webhook_gateway']},
            {id:'shipping_tracking',label:'📦 متابعة الشحنات',x:()=>cx()-200,y:()=>cy()-80,r:34,color:'#198754',type:'agent',pulse:false,connections:['shopify_core','webhook_gateway']},
            {id:'webhook_gateway',label:'🔌 Webhook Gateway',x:()=>cx(),y:()=>cy()-160,r:30,color:'#6f42c1',type:'gateway',pulse:false,connections:['customer_support','shipping_tracking']},
            {id:'whatsapp',label:'💬 WhatsApp',x:()=>cx()+150,y:()=>cy()-260,r:22,color:'#25D366',type:'channel',pulse:false,connections:['webhook_gateway']},
            {id:'messenger',label:'💬 Messenger',x:()=>cx()-50,y:()=>cy()-280,r:22,color:'#006AFF',type:'channel',pulse:false,connections:['webhook_gateway']},
            {id:'instagram',label:'📸 Instagram',x:()=>cx()-180,y:()=>cy()-200,r:22,color:'#E4405F',type:'channel',pulse:false,connections:['webhook_gateway']}
        ];
        function getNodeAt(mx,my){for(const n of NODES){const dx=mx-n.x(),dy=my-n.y();if(dx*dx+dy*dy<=(n.r+8)*(n.r+8))return n}return null}
        canvas.addEventListener('click',(e)=>{const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,node=getNodeAt(mx,my);if(node)showInfo(node);else hideInfo()});
        let particles=[];const MAX_PARTICLES=30;
        function spawnParticle(from,to){particles.push({x:from.x(),y:from.y(),tx:to.x(),ty:to.y(),progress:0,speed:0.008+Math.random()*0.006,color:to.color,size:2+Math.random()*2,alive:true});if(particles.length>MAX_PARTICLES)particles.shift()}
        function updateParticles(){for(const p of particles){p.progress+=p.speed;if(p.progress>=1){p.alive=false;continue}p.x+=(p.tx-p.x)*0.04;p.y+=(p.ty-p.y)*0.04}particles=particles.filter(p=>p.alive)}
        function drawBackground(){ctx.strokeStyle='rgba(255,255,255,0.015)';ctx.lineWidth=1;const step=60;for(let x=0;x<W/devicePixelRatio;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H/devicePixelRatio);ctx.stroke()}for(let y=0;y<H/devicePixelRatio;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W/devicePixelRatio,y);ctx.stroke()}}
        function drawConnection(n1,n2,now){const x1=n1.x(),y1=n1.y(),x2=n2.x(),y2=n2.y();const grad=ctx.createLinearGradient(x1,y1,x2,y2);grad.addColorStop(0,n1.color+'40');grad.addColorStop(1,n2.color+'40');ctx.strokeStyle=grad;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([4,8]);ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
        function drawNode(node,now){const x=node.x(),y=node.y(),r=node.r,active=node.pulse;const glowSize=active?30+Math.sin(now/400)*12:10;const glow=ctx.createRadialGradient(x,y,r*0.3,x,y,r+glowSize);glow.addColorStop(0,node.color+(active?'60':'30'));glow.addColorStop(0.5,node.color+(active?'30':'15'));glow.addColorStop(1,node.color+'00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,r+glowSize,0,Math.PI*2);ctx.fill();if(active){const ringRadius=r+10+Math.sin(now/300)*8;ctx.strokeStyle=node.color+'50';ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.beginPath();ctx.arc(x,y,ringRadius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}ctx.shadowColor=node.color;ctx.shadowBlur=active?25+Math.sin(now/400)*10:8;ctx.fillStyle=node.color+'25';ctx.strokeStyle=node.color+(active?'AA':'77');ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;if(active){const inner=ctx.createRadialGradient(x,y,0,x,y,r);inner.addColorStop(0,node.color+'40');inner.addColorStop(1,node.color+'05');ctx.fillStyle=inner;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}ctx.font=(node.type==='core'?'22px':node.type==='agent'?'18px':'14px')+' sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const icons={'shopify_core':'⚡','customer_support':'🤝','shipping_tracking':'📦','webhook_gateway':'🔌','whatsapp':'💬','messenger':'💬','instagram':'📸'};ctx.fillStyle='#fff';ctx.globalAlpha=0.9;ctx.fillText(icons[node.id]||'●',x,y);ctx.globalAlpha=1;ctx.font=(node.type==='core'?'12px':'10px')+' sans-serif';ctx.fillStyle=active?(node.color+'DD'):'rgba(255,255,255,0.5)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(node.label,x,y+r+8);if(active){ctx.fillStyle='#198754';ctx.beginPath();ctx.arc(x+r-4,y-r+4,4,0,Math.PI*2);ctx.fill()}}
        function drawParticles(){for(const p of particles){const alpha=1-Math.abs(0.5-p.progress)*2;ctx.fillStyle=p.color;ctx.globalAlpha=alpha*0.8;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.globalAlpha=1}
        function draw(now){ctx.clearRect(0,0,W/devicePixelRatio,H/devicePixelRatio);drawBackground();const connected=[];for(const node of NODES){for(const connId of node.connections){const target=NODES.find(n=>n.id===connId);if(target&&!connected.includes(node.id+'-'+connId)){drawConnection(node,target,now);connected.push(node.id+'-'+connId);connected.push(connId+'-'+node.id)}}}if(Math.random()<0.05&&particles.length<MAX_PARTICLES){const activeNodes=NODES.filter(n=>n.pulse);if(activeNodes.length>0){const src=activeNodes[Math.floor(Math.random()*activeNodes.length)],dstId=src.connections[Math.floor(Math.random()*src.connections.length)],dst=NODES.find(n=>n.id===dstId);if(dst)spawnParticle(src,dst)}}if(Math.random()<0.02&&particles.length<MAX_PARTICLES){const src=NODES[Math.floor(Math.random()*NODES.length)];if(src.connections.length>0){const dstId=src.connections[Math.floor(Math.random()*src.connections.length)],dst=NODES.find(n=>n.id===dstId);if(dst)spawnParticle(src,dst)}}updateParticles();drawParticles();for(const node of NODES){drawNode(node,now)}requestAnimationFrame(draw)}
        async function fetchLiveStatus(){try{const resp=await fetch('/api/agent/live-status');if(!resp.ok)return;const data=await resp.json();const agents=data.available_agents||[];for(const agent of agents){const node=NODES.find(n=>n.id===agent.id);if(node)node.pulse=agent.active||false}window._liveMetrics=data.agent_metrics||{}}catch(e){}}
        function showInfo(node){const panel=document.getElementById('infoPanel'),title=document.getElementById('infoTitle'),stats=document.getElementById('infoStats');title.innerHTML='<span style="color:'+node.color+'">●</span> '+node.label;const metrics=window._liveMetrics||{},m=metrics[node.id]||{};let html='';html+='<div class="stat"><span>الحالة</span><span class="val"><span class="tag '+(node.pulse?'tag-success':'tag-warning')+'">'+(node.pulse?'نشط 🟢':'ساكن ⚪')+'</span></span></div>';html+='<div class="stat"><span>النوع</span><span class="val">'+(node.type==='core'?'🖥️ Core':node.type==='agent'?'🤖 Agent':node.type==='gateway'?'🔌 Gateway':'📡 Channel')+'</span></div>';html+='<div class="stat"><span>الاتصالات</span><span class="val">'+node.connections.length+'</span></div>';if(m.messages_today!==undefined)html+='<div class="stat"><span>رسائل اليوم</span><span class="val">'+m.messages_today+'</span></div>';if(m.avg_response_s!==undefined)html+='<div class="stat"><span>متوسط الرد</span><span class="val">'+m.avg_response_s+'s</span></div>';if(m.last_activity)html+='<div class="stat"><span>آخر نشاط</span><span class="val">'+m.last_activity+'</span></div>';stats.innerHTML=html;panel.classList.add('visible')}
        function hideInfo(){document.getElementById('infoPanel').classList.remove('visible')}
        requestAnimationFrame(draw);fetchLiveStatus();setInterval(fetchLiveStatus,5000);
    </script>
</body>
</html>
